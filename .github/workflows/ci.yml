name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 类型检查与构建
    runs-on: windows-latest
    env:
      # 构建与类型检查不需要 Electron 运行时，跳过二进制下载以加快 CI
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建前端产物
        run: npm run build:only

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

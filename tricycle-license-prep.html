.doc-item.is-active::before{left:0;top:8px;bottom:8px;width:2px;border-radius:0;background:var(--ink);}
.doc-no{font:400 8.5px var(--font-num);letter-spacing:.06em;color:var(--muted);}
.doc-ttl{font-family:var(--font-display);font-size:14px;font-weight:600;line-height:1.5;}
.doc-meta{font:400 8.5px var(--font-num);letter-spacing:.04em;color:var(--muted);}
.doc-state{font:400 8.5px var(--font-num);color:var(--green);}
.doc-body{padding:44px 52px 40px;border:1px solid var(--line);background:var(--surface);}
.doc-body h2{font-family:var(--font-display);font-size:44px;font-weight:600;line-height:1.2;letter-spacing:.02em;margin-top:14px;}
.dek{font-size:13.5px;line-height:1.85;color:var(--muted);max-width:60ch;}
.doc-body h4{
  font-family:var(--font-display);
  font-size:18px;
  font-weight:600;
  border-top:1px solid var(--line);
  padding-top:18px;
  margin:26px 0 12px;
}
.doc-body p{font-size:13.5px;line-height:1.95;color:var(--ink-2);}
.diagram{border:1px solid var(--line);background:var(--paper);padding:18px;border-radius:0;}
.diagram figcaption{margin-top:10px;text-align:left;font:400 8.5px var(--font-num);letter-spacing:.14em;color:var(--muted);}
.steps li{border-bottom:1px solid var(--line);}
.step-no{width:24px;height:24px;border:1px solid var(--line);border-radius:0;background:transparent;color:var(--muted);font:400 8.5px var(--font-num);}
.steps p{font-size:13px;line-height:1.8;}
.tip{border:1px solid var(--line);border-left:3px solid var(--green);border-radius:0;background:transparent;font-size:12px;line-height:1.8;}
.tip .od-icon{color:var(--green);}
.doc-foot{border-top:1px solid var(--line);padding-top:18px;}

.video-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;}
.video-card{border:1px solid var(--line);border-radius:0;background:var(--surface);}
.video-card:hover{border-color:var(--ink);transform:none;}
.video-poster{background:var(--ink);}
.video-poster::before{display:none;}
.play{border-radius:0;background:transparent;border:1px solid rgba(241,243,237,.4);}
.video-card:hover .play{background:var(--green);border-color:var(--green);transform:none;}
.video-poster .course-no{font:400 8.5px var(--font-num);letter-spacing:.16em;color:rgba(241,243,237,.66);}
.video-poster .dur{font:400 8.5px var(--font-num);background:rgba(0,0,0,.35);border-radius:0;}
.video-body{padding:15px 16px 17px;}
.video-title{font-family:var(--font-display);font-size:15px;font-weight:600;line-height:1.5;color:var(--ink);}
.video-desc{font-size:10.5px;line-height:1.7;color:var(--muted);}
.article-lead{border:0;border-left:3px solid var(--ink);border-radius:0;background:transparent;padding:2px 0 2px 16px;font-size:12px;line-height:1.85;color:var(--muted);}

/* column */
.feature{
  background:var(--ink);
  border:1px solid var(--ink);
  border-radius:0;
  padding:42px 44px;
}
.feature::after{display:none;}
.feature-title{
  font-family:var(--font-display);
  font-size:46px;
  font-weight:600;
  line-height:1.2;
  letter-spacing:.02em;
  max-width:20ch;
  color:#F1F3ED;
  margin-top:10px;
}
.feature-copy{font-size:12.5px;line-height:1.85;color:rgba(241,243,237,.62);max-width:52ch;}
.feature-meta{font:400 9px var(--font-num);letter-spacing:.1em;color:rgba(241,243,237,.45);}
.article-grid{grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);}
.article-card{
  border:0;
  border-bottom:1px solid var(--line);
  border-right:1px solid var(--line);
  border-radius:0;
  padding:22px 24px;
  background:transparent;
}
.article-card:nth-child(even){border-right:0;}
.article-card:hover{background:var(--paper-2);transform:none;}
.article-cat{
  background:transparent;
  border:1px solid var(--line);
  border-radius:0;
  padding:2px 6px;
  font:400 8.5px var(--font-num);
  letter-spacing:.1em;
  color:var(--muted);
}
.article-title{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.4;letter-spacing:.02em;}
.article-dek{font-size:11.5px;line-height:1.75;color:var(--muted);}
.article-meta{font:400 8.5px var(--font-num);letter-spacing:.08em;color:var(--muted);}
.article-page{max-width:780px;}
.article-page .doc-body{padding:44px 56px;}
.article-page h2{font-size:46px;}
.prose{margin-top:22px;}
.prose p{font-size:14.5px;line-height:1.95;color:var(--ink-2);margin-bottom:15px;}
.prose p:first-of-type::first-letter{
  font-family:var(--font-display);
  font-size:3.3em;
  float:left;
  line-height:.82;
  padding:8px 8px 0 0;
  color:var(--ink);
}
.prose h4{font-family:var(--font-display);font-size:19px;font-weight:600;border-top:1px solid var(--line);padding-top:16px;margin:28px 0 10px;}
.prose .callout{border:1px solid var(--line);border-left:3px solid var(--ink);background:var(--paper-2);border-radius:0;font-size:12.5px;line-height:1.85;}
.back-link{font:500 9px var(--font-num);letter-spacing:.1em;color:var(--muted);border-bottom:1px solid transparent;}
.back-link:hover{color:var(--ink);border-bottom-color:var(--ink);}

/* bank */
.bank-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:56px;}
.bank-grid .card{border:0;border-top:1px solid var(--line);background:transparent;}
.bank-grid .card:first-child{border-top:2px solid var(--ink);}
.bank-grid .card-head{padding:12px 0;border-bottom:0;}
.bank-grid .card-body{padding:0 0 20px;}
.bank-grid .stack{gap:32px;}
.region-group{margin-bottom:18px;}
.region-group-title{font:400 8.5px var(--font-num);letter-spacing:.16em;color:var(--muted);margin-bottom:6px;}
.region-grid{
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}
.region-grid button{
  min-height:38px;
  border:0;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  border-radius:0;
  background:transparent;
  font:400 10.5px var(--font-num);
  letter-spacing:.02em;
  color:var(--muted);
}
.region-grid button:hover{background:var(--paper-2);color:var(--ink);border-color:var(--line);}
.region-grid button.is-active{background:var(--ink);color:var(--surface);font-weight:400;border-color:var(--ink);}
.table{font-size:11.5px;}
.table th{font:400 8.5px var(--font-num);letter-spacing:.12em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);}
.table td{padding:10px 6px;border-bottom:1px solid var(--line);}
.log-row{grid-template-columns:84px minmax(0,1fr) auto;border-bottom:1px solid var(--line);font-size:11px;padding:10px 0;}
.log-row .d{font:400 8.5px var(--font-num);letter-spacing:.04em;color:var(--muted);}
.data-actions{display:flex;flex-direction:column;align-items:flex-start;gap:10px;}
.data-actions .btn{
  min-height:28px;
  padding:0 0 5px;
  border:0;
  border-bottom:1px solid var(--line);
  background:transparent;
  border-radius:0;
  font:500 10px var(--font-num);
  letter-spacing:.05em;
  color:var(--muted);
}
.data-actions .btn:hover{border-bottom-color:var(--ink);color:var(--ink);background:transparent;}
.about-copy{font-size:11.5px;line-height:1.95;color:var(--muted);}

/* modal + toast */
.scrim{background:rgba(10,21,17,.56);}
.modal{background:var(--surface);border:1px solid var(--ink);border-radius:0;box-shadow:none;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);}
.modal-head h3{font-family:var(--font-display);font-size:18px;font-weight:600;}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);}
.modal-copy{font-size:12px;line-height:1.85;color:var(--muted);}
.player{border-radius:0;background:var(--ink);}
.player::before{display:none;}
.player .play{width:40px;height:40px;}
.player strong{font:500 12px var(--font-num);letter-spacing:.06em;}
.player span:last-child{font-size:10.5px;color:rgba(241,243,237,.66);}
.toast{
  background:var(--ink);
  color:var(--surface);
  border:1px solid rgba(241,243,237,.16);
  border-radius:0;
  box-shadow:none;
  font:400 10px var(--font-num);
  letter-spacing:.04em;
}

/* responsive */
@media (max-width:1220px){
  .lead{grid-template-columns:minmax(0,1fr) 280px;gap:40px;}
  .home-grid{grid-template-columns:1fr;gap:36px;}
  .home-margin{
    border-left:0;
    border-top:1px solid var(--line);
    padding-left:0;
    padding-top:24px;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:32px;
  }
  .margin-block{border-bottom:0;margin-bottom:0;padding-bottom:0;}
  .practice-grid,.exam-grid{grid-template-columns:minmax(0,1fr) 260px;gap:36px;}

  .doc-list{max-height:240px;border-right:0;border-bottom:1px solid var(--line);}
  .result-hero{grid-template-columns:1fr;}

  .doc-item{min-height:44px;}

}

@media (max-width:680px){
  .page-head{padding-bottom:14px;margin-bottom:22px;}
  .page-title{font-size:30px;}
  .page-sub{font-size:9.5px;}
  .folio{font-size:8.5px;}
  .lead{padding:24px 0 26px;}
  .lead-title{font-size:38px;}
  .lead-quote{font-size:13px;}
  .lead-meta span{padding:0 7px;}
  .lead-actions{gap:10px;}
  .lead-actions .btn{flex:1 1 auto;}
  .lead-actions .text-link{flex-basis:100%;}
  .route-track{grid-template-columns:1fr;gap:0;border-top:0;padding-top:0;}
  .route-track::before{left:10px;right:auto;top:10px;bottom:10px;border-top:0;border-left:1px solid var(--line);}
  .route-stop{flex-direction:row;align-items:center;gap:12px;padding:9px 0;}
  .route-dot{width:20px;height:20px;}
  .route-copy{flex-direction:row;align-items:baseline;gap:8px;}
  .route-meta{margin-left:auto;text-align:right;}
  .register-row{grid-template-columns:24px minmax(0,1fr) auto;gap:6px 12px;padding:14px 0;}
  .register-bar{display:none;}
  .register-pct{grid-column:2;grid-row:2;text-align:left;font-size:8.5px;}
  .register-row .tag{grid-column:3;grid-row:1 / span 2;align-self:center;}
  .register-name{font-size:17px;}

  .stem{font-size:21px;line-height:1.6;}

  .qfoot{flex-direction:column;align-items:stretch;gap:10px;}

  .nav-btns .btn{flex:1;}
  .rail{grid-template-columns:1fr;}
  .rail-card:last-child{grid-column:auto;}
  .admit-band{padding:24px 20px 22px;}
  .admit-band h2{font-size:32px;}
  .admit-body{padding:20px 20px 24px;}
  .admit-rules > div{padding:12px 10px;}
  .admit-rules b{font-size:22px;}
  .admit-actions .btn{flex:1 1 auto;}
  .result-score{padding:26px 24px;}
  .result-score strong{font-size:84px;}
  .result-stats{grid-template-columns:1fr 1fr;}
  .result-stats .stat{padding:15px 16px;}
  .doc-body{padding:28px 22px 26px;}
  .doc-body h2{font-size:32px;}
  .article-page .doc-body{padding:28px 22px 26px;}
  .article-page h2{font-size:34px;}
  .prose p{font-size:14px;}
  .prose p:first-of-type::first-letter{font-size:3em;}
  .video-grid{grid-template-columns:1fr;}
  .feature{padding:30px 22px;}
  .feature-title{font-size:32px;}
  .region-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .region-grid button{min-height:44px;}
  .sheet{grid-template-columns:repeat(6,minmax(0,1fr));}
  .sheet button{height:44px;}
  .table th:nth-child(3),.table td:nth-child(3){display:none;}
  .log-row{grid-template-columns:72px minmax(0,1fr) auto;gap:8px;}
  .reading-title{font-size:22px;}
  .reading-card{padding:22px 0;}
  .reading-card--ink{padding:22px;}

@media (max-width:420px){
  .viewport{padding:22px 16px 98px;}
  .topbar{padding:0 16px;}
  .top-context-text span{max-width:40vw;}
  .lead-title{font-size:34px;}
  .lead-actions .btn{width:100%;}
  .lead-actions .text-link{justify-content:flex-start;}
  .admit-actions{flex-direction:column;}
  .admit-actions .btn{width:100%;}
  .region-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .region-grid button{font-size:9.5px;}
  .result-score strong{font-size:74px;}
}

@media (prefers-reduced-motion:reduce){
  .view.is-active{animation:none;}
  .chapter-card:hover,.entry:hover,.video-card:hover,.article-card:hover,.btn:active,.reading-card:hover,.register-row:hover{transform:none;}
  .video-card:hover .play{transform:none;}
}

/* ── v3: soft monochrome (Apple-leaning) ────────────────────────────── */
:root{
  --paper:#F4F4F4;
  --paper-2:#EDEDED;
  --surface:#FFFFFF;
  --fill:#EDEDED;
  --fill-2:#E4E4E4;
  --ink:#202020;
  --ink-2:#2C2C2E;
  --muted:#6E6E73;
  --faint:#6E6E73;
  --line:rgba(32,32,32,.08);
  --line-2:rgba(32,32,32,.14);

  --green:#1D7A46;
  --green-deep:#16603A;
  --green-soft:#E8F3EC;
  --green-tint:#F0F7F2;
  --green-line:#CFE5D8;

  --orange:#B3261E;
  --orange-ink:#9A1F18;
  --orange-soft:#FBEDEB;

  --red:#B3261E;
  --red-ink:#9A1F18;
  --red-soft:#FBEDEB;

  --amber:#8A6A1F;
  --amber-soft:#F6F0DF;
  --warn:#8A6A1F;
  --ok:var(--green);
  --err:var(--red);

  --radius-sm:10px;
  --radius:16px;
  --radius-lg:22px;
  --shadow-1:0 1px 2px rgba(0,0,0,.04);
  --shadow-2:0 12px 32px -20px rgba(0,0,0,.22);
  --shadow-card:0 1px 2px rgba(0,0,0,.04), 0 10px 28px -22px rgba(0,0,0,.20);

  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro SC","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --font-display:var(--font-sans);
  --font-num:var(--font-sans);
  --font-mono:var(--font-sans);
}

/* kill tracking / uppercase / serif leftovers */
body{background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--font-sans);font-variant-numeric:tabular-nums;letter-spacing:0;}
body::before{display:none;}
h1,h2,h3,h4{font-family:var(--font-sans);font-weight:600;letter-spacing:-.01em;line-height:1.25;}
p{line-height:1.7;}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 4px rgba(32,32,32,.12);}
.sidebar :focus-visible{outline-color:var(--ink);box-shadow:0 0 0 4px rgba(32,32,32,.12);}
::selection{background:var(--ink);color:var(--paper);}
.sidebar{scrollbar-color:#C9C9C9 transparent;}

.folio,.label,.kicker,.nav-label,.nav-index,.tag,.chip,.page-sub,.lead-meta,.lead-foot,
.ledger-row span,.route-meta,.register-index,.register-pct,.reading-meta,.admit-code,
.timer-label,.result-label,.result-score strong small,.stat-k,.stat-f,.doc-no,.doc-meta,
.doc-state,.article-meta,.region-group-title,.table th,.log-row .d,.mode-tab,.qidx,
.opt-mark,.basis,.src,.hint,.rail-head span,.review-a,.video-poster .course-no,
.video-poster .dur,.feature-meta,.article-cat,.admit-rules span,.sheet button,.legend,
.brand-text span,.region-label,.region-meta,.sidebar-foot,.sidebar-foot p,.top-stat,
.top-context-text span,.article-lead,.back-link,.about-copy,.modal-copy,.step-no,.kbd,
.data-actions .btn,.region-line,.video-desc,.video-title,.lead-title,.page-title{
  letter-spacing:0 !important;
  text-transform:none !important;
}

/* shell */
.app{grid-template-columns:252px minmax(0,1fr);}
.sidebar{
  background:#ECECEC;
  color:var(--ink);
  padding:24px 16px 16px;
  gap:16px;
  border-right:1px solid var(--line);
  scrollbar-color:#C9C9C9 transparent;
}
.brand{padding:0 6px 16px;border-bottom:1px solid var(--line);border-radius:0;gap:12px;}
.brand-mark{
  width:36px;height:36px;border:0;border-radius:10px;
  background:var(--ink);color:var(--paper);
  font:600 15px/1 var(--font-sans);box-shadow:none;
}
.brand-text strong{font-family:var(--font-sans);font-size:16px;font-weight:600;color:var(--ink);}
.brand-text span{font:400 11px var(--font-sans);color:#5F5F64;}
.region-card{
  border:0;background:var(--surface);border-radius:14px;
  padding:12px 14px;box-shadow:var(--shadow-1);
}
.region-card:hover{background:var(--surface);border:0;}
.region-label{font:500 10px var(--font-sans);color:var(--muted);}
.region-line{font-size:15px;font-weight:500;color:var(--ink);}
.region-line b{font-family:var(--font-sans);font-weight:600;}
.region-line .od-icon{color:var(--muted);}
.region-arrow{color:var(--faint);}
.region-meta{font:400 10px var(--font-sans);color:var(--muted);}

.nav-label{padding:16px 10px 6px;font:500 11px var(--font-sans);color:#5F5F64;}
.nav-item{
  min-height:44px;padding:0 12px;border:0;border-radius:10px;
  gap:10px;font-size:13.5px;font-weight:400;color:#4A4A4F;
}
.nav-item .od-icon{display:inline-block;color:var(--muted);}
.nav-item .nav-index{display:none;}
.nav-item:hover{background:rgba(32,32,32,.05);color:var(--ink);}
.nav-item.is-active{
  background:var(--surface);color:var(--ink);font-weight:600;
  border-left-color:transparent;box-shadow:var(--shadow-1);
}
.nav-item.is-active::before{display:none;}
.nav-item.is-active .od-icon{color:var(--ink);}
.sidebar-foot{border-top:1px solid var(--line);color:#5F5F64;font:400 10px var(--font-sans);padding:14px 10px 0;}
.foot-dot{width:6px;height:6px;border-radius:50%;background:var(--ink);}
.sidebar-foot p{color:#5F5F64;font:400 10px/1.6 var(--font-sans);}

.main{min-width:0;}
.topbar{
  min-height:64px;padding:0 40px;
  background:rgba(244,244,244,.82);
  border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
}
.top-context{gap:12px;}
.top-brand{
  width:30px;height:30px;border:0;border-radius:9px;
  background:var(--ink);color:var(--paper);font:600 12px var(--font-sans);
}
.top-context-text strong{font-family:var(--font-sans);font-size:16px;font-weight:600;}
.top-context-text span{font:400 11px var(--font-sans);color:var(--muted);}
.top-actions{gap:16px;}
.top-stat{font:400 12px var(--font-sans);color:var(--muted);}
.top-stat b{font-weight:600;color:var(--ink);}
.seg{background:var(--fill);border:0;border-radius:999px;padding:3px;gap:2px;}
.seg button{
  height:30px;padding:0 14px;border:0;border-radius:999px;
  font:500 12px var(--font-sans);color:var(--muted);
}
.seg button:hover{color:var(--ink);}
.seg button.is-active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);border:0;}
.seg-sm{padding:3px;}
.seg-sm button{height:30px;padding:0 14px;font-size:12px;}

.viewport{padding:36px 40px 88px;}
.canvas{max-width:1180px;}
.view.is-active{animation:fade .18s ease;}

/* editorial primitives → quiet labels */
.folio{font:500 11px var(--font-sans);color:var(--muted);}
.label{
  min-height:24px;padding:3px 10px;border:0;border-radius:999px;
  background:var(--fill);font:500 11px var(--font-sans);color:#5A5A5F;
}
.text-link{
  min-height:34px;padding:0 12px;border:0;border-radius:999px;
  background:var(--fill);color:var(--ink);font:500 12px var(--font-sans);gap:6px;
}
.text-link:hover{background:var(--fill-2);color:var(--ink);border:0;}

.page-head{align-items:center;border-bottom:0;padding-bottom:0;margin-bottom:24px;gap:16px;}
.page-title{font-family:var(--font-sans);font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.2;}
.page-sub{margin-top:8px;font:400 12px/1.6 var(--font-sans);color:var(--muted);}
.page-tools{gap:12px;}

.section-head{border-top:0;padding-top:0;margin-bottom:12px;align-items:baseline;}
.section-head h2{font-size:20px;font-weight:600;}
.section-head span{font:400 12px var(--font-sans);color:var(--muted);}

.kicker{font:500 12px var(--font-sans);color:var(--muted);background:transparent;border:0;padding:0;gap:8px;}
.kicker i{width:14px;height:1px;background:var(--muted);}
.kicker.on-dark{color:rgba(244,244,244,.66);}
.kicker.on-dark i{background:rgba(244,244,244,.4);}

/* buttons */
.btn{
  min-height:44px;padding:0 20px;border:0;border-radius:999px;
  font:500 14px var(--font-sans);box-shadow:none;gap:8px;
}
.btn:active{transform:none;}
.btn-primary{background:var(--ink);color:#FFFFFF;}
.btn-primary:hover{background:#000000;}
.btn-secondary{background:var(--surface);border:1px solid var(--line-2);color:var(--ink);}
.btn-secondary:hover{background:#FAFAFA;border-color:rgba(32,32,32,.24);}
.btn-ghost{background:transparent;color:var(--muted);padding:0 10px;border:0;}
.btn-ghost:hover{background:var(--fill);color:var(--ink);border:0;}
.btn-danger{background:transparent;border:1px solid var(--line-2);color:var(--red-ink);}
.btn-danger:hover{background:var(--red-soft);border-color:var(--red);}
.btn-sm{min-height:36px;padding:0 14px;font-size:12.5px;}
.btn-lg{min-height:50px;padding:0 22px;font-size:15px;}
.btn:disabled{opacity:.36;}
.btn:disabled:hover{background:transparent;border-color:var(--line-2);}

.icon-btn{width:40px;height:40px;border:0;border-radius:50%;background:var(--fill);color:var(--muted);}
.icon-btn:hover{background:var(--fill-2);border:0;color:var(--ink);}
.icon-btn.is-fav{color:var(--red);background:var(--red-soft);border:0;}
.icon-btn.is-on{color:var(--ink);background:var(--fill-2);border:0;}

.tag{
  min-height:0;padding:3px 9px;border:0;border-radius:999px;
  background:var(--fill);color:#5A5A5F;
  font:500 11px var(--font-sans);line-height:1.5;
}
.tag-ok{background:var(--green-soft);color:var(--green);}
.tag-warn{background:var(--red-soft);color:var(--red-ink);}
.tag-err{background:var(--red-soft);color:var(--red-ink);}
.tag-ink{background:var(--ink);color:#fff;}
.tag-line{background:var(--fill);color:#5A5A5F;}
.tag-accent{background:var(--fill-2);color:var(--ink);}

.chip{
  min-height:34px;padding:0 14px;border:0;border-radius:999px;
  background:var(--fill);color:#5A5A5F;font:500 12px var(--font-sans);gap:6px;
}
.chip:hover{background:var(--fill-2);color:var(--ink);border:0;}
.chip.is-active{background:var(--ink);color:#fff;border:0;}
.chip .num{font-size:11px;opacity:.6;}

.progress{height:4px;border-radius:999px;background:#E6E6E6;overflow:hidden;}
.progress > i{height:4px;border-radius:999px;background:var(--ink);transition:width .22s ease;}
.kbd{border:0;border-radius:6px;background:var(--fill);font:500 11px/18px var(--font-sans);color:var(--muted);padding:0 6px;}

/* cards */
.card,.rail-card,.chapter-card,.entry,.article-card,.video-card,.admit,.result-hero,
.doc-body,.feature,.qcard,.stat,.modal,.toast,.player,.diagram,.tip,.verdict,.explain,
.step-no,.entry-arrow{border-radius:var(--radius);box-shadow:none;}
.card{background:var(--surface);border:0;border-radius:18px;box-shadow:var(--shadow-card);}
.card-head{padding:18px 22px;border-bottom:1px solid var(--line);}
.card-head h3{font-size:16px;font-weight:600;}
.card-head .hint{font:400 11px var(--font-sans);color:var(--muted);}
.card-body{padding:20px 22px;}
.kv-row{border-bottom:1px solid var(--line);padding:10px 0;font-size:13px;}
.kv-row > span{color:var(--muted);}
.kv-row > b{font:500 13px var(--font-sans);}
.kv-row > b.txt{font-family:var(--font-sans);}

/* home lead */
.lead{
  display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:40px;
  border:0;border-radius:24px;background:var(--surface);
  padding:32px 34px;box-shadow:var(--shadow-card);
}
.lead-main{min-width:0;}
.lead-title{
  font-family:var(--font-sans);font-size:clamp(34px,3.4vw,46px);
  font-weight:700;line-height:1.14;letter-spacing:-.025em;margin:14px 0 10px;
}
.lead-quote{font-size:15px;line-height:1.72;color:var(--muted);max-width:46ch;margin:0 0 18px;}
.lead-meta{display:flex;flex-wrap:wrap;margin:0 0 24px;font:400 11.5px var(--font-sans);color:var(--muted);}
.lead-meta span{padding:0 10px;border-left:1px solid var(--line);}
.lead-meta span:first-child{padding-left:0;border-left:0;}
.lead-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

.lead-side{
  border-left:1px solid var(--line);padding-left:28px;
  display:flex;flex-direction:column;justify-content:center;
}
.ledger{width:100%;}
.ledger-row{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:10px 0;border-bottom:1px solid var(--line);
}
.ledger-row span{font:400 12px var(--font-sans);color:var(--muted);}
.ledger-row b{font:600 14px var(--font-sans);color:var(--ink);white-space:nowrap;}
.ledger-row b small{font:400 11px var(--font-sans);color:var(--muted);}
.lead-progress{height:6px;border-radius:999px;background:#E6E6E6;margin:18px 0 10px;overflow:hidden;}
.lead-progress i{display:block;height:6px;border-radius:999px;background:var(--ink);}
.lead-foot{font:400 11px var(--font-sans);color:var(--muted);}

/* route as soft steps */
.route-block{margin:24px 0 32px;}
.route-head{
  border-top:0;padding-top:0;margin-bottom:12px;align-items:baseline;
}
.route-head h2{font-size:19px;font-weight:600;}
.route-head span{font:400 12px var(--font-sans);color:var(--muted);}
.route-track{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;
  border:0;padding:0;
}
.route-track::before{display:none;}
.route-stop{
  background:var(--surface);border-radius:14px;padding:12px;
  flex-direction:row;align-items:center;gap:10px;text-align:left;
  box-shadow:var(--shadow-1);padding-right:12px;
}
.route-dot{
  width:28px;height:28px;border:0;border-radius:50%;
  background:var(--fill);color:var(--muted);font:600 11px var(--font-sans);
}
.route-stop.is-done .route-dot{background:var(--ink);border:0;color:#fff;}
.route-stop.is-now .route-dot{background:#fff;border:1px solid rgba(32,32,32,.2);color:var(--ink);box-shadow:none;}
.route-copy{flex-direction:column;align-items:flex-start;gap:2px;}
.route-name{font-family:var(--font-sans);font-size:13.5px;font-weight:600;line-height:1.4;}
.route-meta{font:400 11px var(--font-sans);color:var(--muted);}

/* register + margin */
.home-grid{
  display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
  gap:24px;align-items:start;margin-top:0;
}
.register-section{min-width:0;}
.register{border:0;display:flex;flex-direction:column;gap:8px;}
.register-row{
  display:grid;grid-template-columns:36px minmax(0,1fr) 110px 46px auto;
  gap:14px;align-items:center;width:100%;
  padding:15px 18px;border:0;border-radius:14px;
  background:var(--surface);text-align:left;box-shadow:var(--shadow-1);
}
.register-row:hover{background:#FAFAFA;transform:none;}
.register-index{font:500 11px var(--font-sans);color:var(--faint);}
.register-copy{display:flex;flex-direction:column;gap:2px;min-width:0;}
.register-name{font-family:var(--font-sans);font-size:16px;font-weight:600;line-height:1.4;}
.register-desc{font-size:12px;line-height:1.5;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.register-bar{display:block;height:4px;border-radius:999px;background:#E6E6E6;overflow:hidden;}
.register-bar i{display:block;height:4px;border-radius:999px;background:var(--ink);}
.register-pct{font:500 12px var(--font-sans);text-align:right;color:var(--muted);}
.register-row .tag{justify-self:end;}

.home-margin{border:0;padding:0;display:flex;flex-direction:column;gap:12px;}
.margin-block{padding:20px 22px;margin:0;border:0;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-1);}
.margin-block:last-child{border:0;margin:0;padding-bottom:20px;}
.margin-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;}
.margin-head h3{font-size:15px;font-weight:600;}
.margin-block .ledger-row{padding:8px 0;}
.margin-block .ledger-row b{font-size:13px;}
.version{font:600 22px var(--font-sans);letter-spacing:-.02em;margin:4px 0 6px;}
.wrong-item{padding:10px 0;border-bottom:1px solid var(--line);}
.wrong-item:last-of-type{border-bottom:0;}
.wrong-q{font-size:13px;line-height:1.6;}
.wrong-meta{font:400 11px var(--font-sans);color:#5A5A5F;margin-top:3px;}

/* reading entries */
.reading-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
  border:0;margin-top:20px;
}
.reading-card{
  display:flex;flex-direction:column;gap:10px;min-height:200px;
  padding:26px 28px;border:0;border-radius:20px;
  background:var(--surface);text-align:left;box-shadow:var(--shadow-card);
}
.reading-card:hover{background:#FAFAFA;transform:none;}
.reading-card--ink{background:var(--ink);color:var(--paper);}
.reading-card--ink:hover{background:#000;}
.reading-card--ink .folio{color:rgba(244,244,244,.58);}
.reading-card--ink .reading-copy{color:rgba(244,244,244,.68);}
.reading-card--ink .reading-meta{color:rgba(244,244,244,.56);}
.reading-title{
  font-family:var(--font-sans);font-size:23px;font-weight:600;
  line-height:1.35;letter-spacing:-.015em;max-width:24ch;
}
.reading-copy{font-size:13.5px;line-height:1.7;color:var(--muted);max-width:46ch;}
.reading-meta{margin-top:auto;font:400 11px var(--font-sans);color:var(--muted);}

/* practice */
.mode-tabs{
  display:flex;gap:4px;border:0;border-radius:12px;
  background:var(--fill);padding:4px;margin-bottom:20px;overflow-x:auto;
}
.mode-tab{
  min-height:38px;padding:0 16px;border-radius:9px;
  font:500 13px var(--font-sans);color:#5A5A5F;white-space:nowrap;
}
.mode-tab:hover{color:var(--ink);}
.mode-tab.is-active{color:var(--ink);background:var(--surface);box-shadow:var(--shadow-1);}
.mode-tab.is-active::after{display:none;}
.mode-tab .count{font:500 11px var(--font-sans);color:inherit;}
.chapter-bar{background:transparent;border:0;padding:0;margin:0 0 16px;}

.qcard{padding:30px 32px 24px;border:0;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-card);}
.qbar{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px;}
.qidx{font:500 12px var(--font-sans);color:var(--muted);}
.stem{
  font-family:var(--font-sans);font-size:22px;font-weight:600;
  line-height:1.55;letter-spacing:-.01em;margin-bottom:20px;
}
.sign{border:0;border-radius:16px;background:var(--fill);padding:18px;}
.opts{border-top:0;display:flex;flex-direction:column;gap:8px;}
.opt{
  border:0;border-left:0;border-radius:14px;background:var(--fill);
  padding:14px 16px;font-size:14.5px;line-height:1.55;gap:12px;
}
.opt:hover:not(:disabled){background:var(--fill-2);border:0;}
.opt:disabled{cursor:default;}
.opt-k{
  width:28px;height:28px;border:0;border-radius:50%;
  background:var(--surface);color:var(--muted);font:600 12px var(--font-sans);
}
.opt-t{padding-top:3px;}
.opt-mark{padding-top:6px;font:500 11px var(--font-sans);color:var(--muted);}
.opt.is-picked{border-left-color:transparent;background:var(--fill-2);}
.opt.is-picked .opt-k{background:var(--ink);border:0;color:#fff;}
.opt.is-right{border-left-color:transparent;background:var(--green-soft);}
.opt.is-right .opt-k{background:var(--green);border:0;color:#fff;}
.opt.is-right .opt-mark{color:var(--green);}
.opt.is-wrong{border-left-color:transparent;background:var(--red-soft);}
.opt.is-wrong .opt-k{background:var(--red);border:0;color:#fff;}
.opt.is-wrong .opt-mark{color:var(--red-ink);}

.verdict{
  margin-top:16px;padding:14px 16px;border:0;border-radius:14px;
  border-left:0;background:var(--fill);
}
.verdict.ok{background:var(--green-soft);color:var(--green);}
.verdict.err{background:var(--red-soft);color:var(--red-ink);border-left:0;}
.verdict-icon{border-radius:50%;background:transparent;color:inherit;}
.verdict strong{font-family:var(--font-sans);font-size:15px;font-weight:600;}
.verdict span{font-size:12.5px;}
.explain{margin-top:16px;padding:18px 0 0;border-top:1px solid var(--line);background:transparent;border-radius:0;}
.explain h4{font:600 11px var(--font-sans);color:var(--muted);margin-bottom:8px;}
.explain p{font-size:14px;line-height:1.8;}
.basis{font:400 11px var(--font-sans);color:var(--muted);margin-top:10px;}
.qfoot{border-top:1px solid var(--line);padding-top:16px;margin-top:20px;}
.qfoot .hint{font:400 11px var(--font-sans);color:var(--muted);}
.nav-btns{gap:8px;}

.rail{display:flex;flex-direction:column;gap:12px;border-left:0;padding-left:0;}
.rail-card{background:var(--surface);border:0;border-radius:18px;box-shadow:var(--shadow-1);padding:18px 20px;}
.rail-card:first-child{border-top:0;}
.rail-head{padding:0 0 10px;border-bottom:0;}
.rail-head h3{font-family:var(--font-sans);font-size:15px;font-weight:600;}
.rail-head span{font:400 11px var(--font-sans);color:var(--muted);}
.rail-body{padding:0 0 4px;}
.rail-big{font:600 34px/1.1 var(--font-sans);letter-spacing:-.03em;}
.rail-big span{font:400 12px var(--font-sans);color:var(--muted);}
.rail-note{font-size:12px;color:var(--muted);margin:6px 0 12px;}
.rail .kv{margin-top:8px;}
.rail .kv-row{font-size:12.5px;padding:8px 0;}
.rail .kv-row > b{font-size:12.5px;}
.rail-actions{gap:8px;}
.rail-actions .btn{
  justify-content:flex-start;min-height:42px;padding:0 14px;
  border-radius:12px;background:var(--fill);color:var(--ink);font-weight:500;
}
.rail-actions .btn:hover{background:var(--fill-2);color:var(--ink);}

.done-state,.empty-state{padding:48px 24px;}
.empty-icon{width:52px;height:52px;border:0;border-radius:50%;background:var(--fill);color:var(--muted);}
.empty-state strong{font-family:var(--font-sans);font-size:19px;font-weight:600;}
.done-state .big-num{font:600 52px/1 var(--font-sans);justify-content:center;}
.state-actions{gap:10px;}

/* exam */
.admit{border:0;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-card);overflow:hidden;}
.admit-band{padding:28px 30px 26px;background:var(--ink);color:var(--paper);border-bottom:0;}
.admit-code{font:400 11px var(--font-sans);color:rgba(244,244,244,.58);}
.admit-band h2{font-family:var(--font-sans);font-size:38px;font-weight:700;color:var(--paper);letter-spacing:-.02em;margin-top:8px;}
.admit-band p{font-size:12.5px;color:rgba(244,244,244,.68);}
.admit-body{padding:26px 30px 30px;}
.admit-rules{border:0;border-radius:0;gap:8px;background:transparent;}
.admit-rules > div{border-right:0;padding:16px;background:var(--fill);border-radius:14px;}
.admit-rules > div:last-child{border-right:0;}
.admit-rules span{font:500 11px var(--font-sans);color:var(--muted);}
.admit-rules b{font:600 26px var(--font-sans);}
.admit-rules small{font:400 11px var(--font-sans);color:var(--muted);}
.notice{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;}
.notice h3{font-family:var(--font-sans);font-size:16px;font-weight:600;margin-bottom:8px;}
.notice ul{font-size:13px;line-height:1.9;color:var(--muted);}
.admit-actions{gap:10px;margin-top:22px;}

.exam-top{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px;}
.timer{padding:8px 16px;border:0;border-radius:999px;background:var(--ink);color:#fff;}
.timer-label{font:500 10px var(--font-sans);color:rgba(244,244,244,.62);}
.timer b{font:600 22px var(--font-sans);letter-spacing:0;}
.timer.is-low{background:var(--red);border:0;color:#fff;}
.timer.is-low .timer-label{color:rgba(255,255,255,.78);opacity:1;}
.exam-top .src{font:400 11px var(--font-sans);color:var(--muted);}

.sheet{gap:6px;}
.sheet button{
  height:38px;border:0;border-radius:10px;background:var(--fill);
  font:500 12px var(--font-sans);color:#5A5A5F;
}
.sheet button:hover{border:0;background:var(--fill-2);color:var(--ink);}
.sheet button.done{background:var(--ink);border:0;color:#fff;}
.sheet button.cur{border:0;box-shadow:inset 0 0 0 2px var(--ink);background:#fff;color:var(--ink);}
.sheet button.flag{position:relative;border:0;background:var(--amber-soft);color:var(--amber);}
.sheet button.flag::after{width:5px;height:5px;border-radius:50%;background:var(--amber);}
.sheet button.done.cur{background:var(--ink);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);}
.legend{font:400 11px var(--font-sans);color:var(--muted);gap:12px;}
.legend i{width:8px;height:8px;border:0;border-radius:3px;background:var(--fill-2);}
.legend i.d{background:var(--ink);}
.legend i.f{background:var(--amber-soft);}

.result-hero{
  grid-template-columns:340px minmax(0,1fr);
  border:0;border-radius:24px;background:var(--surface);
  box-shadow:var(--shadow-card);overflow:hidden;margin-bottom:24px;
}
.result-score{padding:32px 34px;background:var(--ink);color:var(--paper);border-radius:0;}
.result-hero.fail .result-score{background:var(--red);}
.result-score::after{display:none;}
.result-label{font:500 11px var(--font-sans);color:rgba(244,244,244,.62);}
.result-score strong{font:700 100px/.96 var(--font-sans);letter-spacing:-.06em;}
.result-score strong small{font:600 13px var(--font-sans);color:rgba(244,244,244,.58);}
.stamp{
  margin-top:14px;padding:5px 12px;border:0;border-radius:999px;
  background:rgba(255,255,255,.18);font:600 12px var(--font-sans);
  color:#fff;transform:none;
}
.result-stats{grid-template-columns:1fr 1fr;}
.result-stats .stat{background:transparent;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:18px 22px;}
.result-stats .stat:nth-child(even){border-right:0;}
.result-stats .stat:nth-last-child(-n+2){border-bottom:0;}
.stat-k{font:500 11px var(--font-sans);color:var(--muted);}
.stat-v{font:600 26px var(--font-sans);letter-spacing:-.02em;}
.stat-v small{font:500 11px var(--font-sans);color:var(--muted);}
.stat-f{font:400 11px var(--font-sans);color:var(--muted);}
.review-item{border-bottom:1px solid var(--line);padding:16px 22px;}
.review-q{font-family:var(--font-sans);font-size:15px;font-weight:600;line-height:1.6;}
.review-a{font:400 12px var(--font-sans);color:var(--muted);}
.review-a b{color:var(--green);}
.review-a del{color:var(--red-ink);}
.review-exp{font-size:13px;line-height:1.8;color:var(--muted);}

/* tutorial */
.doc-grid{grid-template-columns:290px minmax(0,1fr);gap:28px;}
.doc-list{max-height:calc(100vh - 220px);border-right:0;padding:6px;}
.doc-item{border:0;border-radius:12px;padding:12px 14px;margin-bottom:2px;}
.doc-item:hover{background:var(--fill);}
.doc-item.is-active{background:var(--fill);}
.doc-item.is-active::before{display:none;}
.doc-no{font:500 11px var(--font-sans);color:var(--faint);}
.doc-ttl{font-family:var(--font-sans);font-size:14px;font-weight:600;line-height:1.5;}
.doc-meta{font:400 11px var(--font-sans);color:var(--muted);}
.doc-state{font:500 11px var(--font-sans);color:var(--green);}
.doc-body{padding:40px 44px;border:0;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-card);}
.doc-body h2{font-family:var(--font-sans);font-size:36px;font-weight:700;line-height:1.25;letter-spacing:-.02em;margin-top:14px;}
.dek{font-size:15px;line-height:1.75;color:var(--muted);max-width:60ch;}
.doc-body h4{font-family:var(--font-sans);font-size:15px;font-weight:600;margin:26px 0 12px;border-top:1px solid var(--line);padding-top:18px;}
.doc-body p{font-size:14px;line-height:1.85;color:var(--ink-2);}
.diagram{border:0;border-radius:16px;background:var(--fill);padding:18px;}
.diagram figcaption{margin-top:10px;text-align:center;font:400 11px var(--font-sans);color:var(--muted);}
.steps li{border-bottom:1px solid var(--line);padding:12px 0;}
.step-no{width:26px;height:26px;border:0;border-radius:50%;background:var(--fill);color:var(--muted);font:600 11px var(--font-sans);}
.steps p{font-size:14px;line-height:1.75;}
.tip{border:0;border-radius:14px;background:var(--fill);padding:12px 14px;font-size:13px;line-height:1.75;}
.tip .od-icon{color:var(--ink);}
.doc-foot{border-top:1px solid var(--line);padding-top:18px;}
.video-grid{gap:16px;}
.video-card{border:0;border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-card);}
.video-card:hover{border:0;}
.video-poster{background:var(--ink);}
.video-poster::before{display:none;}
.play{border:0;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
.video-card:hover .play{background:rgba(255,255,255,.28);border:0;}
.video-poster .course-no{font:500 11px var(--font-sans);color:rgba(244,244,244,.62);}
.video-poster .dur{font:500 11px var(--font-sans);border-radius:6px;background:rgba(0,0,0,.42);}
.video-body{padding:16px 18px 18px;}
.video-title{font-family:var(--font-sans);font-size:15px;font-weight:600;line-height:1.5;color:var(--ink);}
.video-desc{font-size:12.5px;line-height:1.65;color:var(--muted);}
.article-lead{border:0;border-radius:14px;background:var(--fill);padding:14px 16px;font-size:13px;line-height:1.75;color:#5A5A5F;}

/* column */
.feature{border:0;border-radius:24px;background:var(--ink);padding:40px 42px;}
.feature::after{display:none;}
.feature-title{font-family:var(--font-sans);font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.3;color:var(--paper);}
.feature-copy{font-size:14px;line-height:1.75;color:rgba(244,244,244,.7);max-width:52ch;}
.feature-meta{font:400 11px var(--font-sans);color:rgba(244,244,244,.58);}
.article-grid{grid-template-columns:1fr 1fr;gap:14px;border-top:0;}
.article-card{
  border:0;border-radius:18px;background:var(--surface);
  padding:24px;box-shadow:var(--shadow-card);
}
.article-card:nth-child(even){border-right:0;}
.article-card:hover{background:#FAFAFA;transform:none;}
.article-cat{font:500 11px var(--font-sans);color:var(--muted);}
.article-title{font-family:var(--font-sans);font-size:21px;font-weight:600;line-height:1.4;letter-spacing:-.01em;}
.article-dek{font-size:13px;line-height:1.7;color:var(--muted);}
.article-meta{font:400 11px var(--font-sans);color:var(--faint);}
.article-page{max-width:780px;}
.article-page .doc-body{padding:40px 48px;}
.article-page h2{font-size:38px;}
.prose{margin-top:22px;}
.prose p{font-size:15px;line-height:1.9;color:#333333;margin-bottom:15px;}
.prose p:first-of-type::first-letter{
  float:none;font-size:inherit;line-height:inherit;font-family:inherit;
  font-weight:inherit;color:inherit;padding:0;margin:0;
}
.prose h4{font-family:var(--font-sans);font-size:18px;font-weight:600;border-top:1px solid var(--line);padding-top:16px;margin:28px 0 10px;}
.prose .callout{border:0;border-left:3px solid var(--ink);border-radius:12px;background:var(--fill);font-size:13px;line-height:1.8;}
.back-link{font:500 12px var(--font-sans);color:var(--muted);border:0;}
.back-link:hover{color:var(--ink);border:0;}

/* bank */
.bank-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;}
.bank-grid .card{border:0;border-radius:20px;background:var(--surface);box-shadow:var(--shadow-card);}
.bank-grid .card:first-child{border-top:0;}
.bank-grid .card-head{padding:20px 22px;border-bottom:1px solid var(--line);}
.bank-grid .card-body{padding:20px 22px 22px;}
.bank-grid .stack{gap:16px;}
.region-group{margin-bottom:16px;}
.region-group-title{font:500 11px var(--font-sans);color:var(--faint);margin-bottom:8px;}
.region-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border:0;}
.region-grid button{
  min-height:40px;border:0;border-radius:10px;background:var(--fill);
  color:#5A5A5F;font:500 12.5px var(--font-sans);
}
.region-grid button:hover{background:var(--fill-2);color:var(--ink);border:0;}
.region-grid button.is-active{background:var(--ink);color:#fff;border:0;font-weight:600;}
.table{font-size:13px;}
.table th{font:500 11px var(--font-sans);color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);}
.table td{padding:10px 6px;border-bottom:1px solid var(--line);}
.log-row{grid-template-columns:84px minmax(0,1fr) auto;border-bottom:1px solid var(--line);font-size:12.5px;padding:10px 0;}
.log-row .d{font:400 11px var(--font-sans);color:var(--muted);}
.data-actions{display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
.data-actions .btn{
  min-height:40px;border:0;border-radius:999px;background:var(--fill);
  color:var(--ink);padding:0 16px;font:500 13px var(--font-sans);
}
.data-actions .btn:hover{background:var(--fill-2);border:0;color:var(--ink);}
.about-copy{font-size:13px;line-height:1.85;color:var(--muted);}

/* modal / toast */
.scrim{background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
.modal{background:var(--surface);border:0;border-radius:24px;box-shadow:0 24px 70px -24px rgba(0,0,0,.4);}
.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{font-family:var(--font-sans);font-size:18px;font-weight:600;}
.modal-body{padding:22px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);}
.modal-copy{font-size:13.5px;line-height:1.7;color:var(--muted);}
.player{border-radius:20px;background:var(--ink);}
.player::before{display:none;}
.player .play{width:42px;height:42px;}
.player strong{font:600 13px var(--font-sans);}
.player span:last-child{font-size:12px;color:rgba(244,244,244,.6);}
.toast{
  background:rgba(32,32,32,.94);color:var(--paper);border:0;border-radius:999px;
  padding:10px 18px;font:500 12.5px var(--font-sans);
  box-shadow:0 10px 30px -12px rgba(0,0,0,.4);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}

/* responsive */
@media (max-width:1220px){
  .home-grid{grid-template-columns:1fr;gap:24px;}
  .home-margin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
}
@media (max-width:1080px){
  .lead{grid-template-columns:1fr;gap:24px;}
  .lead-side{border-left:0;border-top:1px solid var(--line);padding-left:0;padding-top:20px;}
  .rail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .topbar{min-height:60px;padding:0 20px;}
  .top-brand{display:grid;}
  .viewport{padding:28px 20px 100px;}
  .page-title{font-size:30px;}
  .seg button{height:40px;}
  .mobile-nav{
    background:rgba(244,244,244,.94);border-top:1px solid var(--line);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    padding:0 0 env(safe-area-inset-bottom);
  }
  .mobile-nav .nav-item{
    min-height:56px;padding:6px 2px;border:0;border-radius:0;
    color:var(--muted);font:500 10.5px var(--font-sans);gap:3px;
  }
  .mobile-nav .nav-item .od-icon{display:inline-block;color:currentColor;}
  .mobile-nav .nav-item .nav-index{display:none;}
  .mobile-nav .nav-item.is-active{
    background:transparent;color:var(--ink);border-top:0;box-shadow:none;
  }
  .mobile-nav .nav-item.is-active::before{display:none;}
  .chip{min-height:44px;padding:0 14px;}
  .icon-btn{width:44px;height:44px;}
  .mode-tab{min-height:44px;padding:0 14px;}
  .text-link{min-height:44px;}
  .doc-item{min-height:44px;}
  .region-grid button{min-height:44px;}
  .sheet button{height:44px;}
  .route-track{grid-template-columns:repeat(2,minmax(0,1fr));}
  .result-hero{grid-template-columns:1fr;}
  .article-grid{grid-template-columns:1fr;}
  .reading-grid{grid-template-columns:1fr;}
  .home-margin{grid-template-columns:1fr;}
  .doc-grid{grid-template-columns:1fr;gap:20px;}
  .doc-list{max-height:260px;border-bottom:1px solid var(--line);}
  .bank-grid{grid-template-columns:1fr;gap:20px;}
  .lead{padding:26px 22px;border-radius:20px;}
  .qcard{padding:24px 20px 20px;border-radius:18px;}
  .admit-band{padding:24px 22px 22px;}
  .admit-body{padding:20px 22px 24px;}
  .doc-body{padding:28px 22px 26px;border-radius:18px;}
  .feature{padding:30px 24px;border-radius:20px;}
  .register-row{grid-template-columns:28px minmax(0,1fr) auto;gap:6px 12px;padding:14px 16px;}
  .register-bar{display:none;}
  .register-pct{grid-column:2;grid-row:2;text-align:left;font-size:11px;}
  .register-row .tag{grid-column:3;grid-row:1 / span 2;align-self:center;}
  .article-card{padding:20px;}
}
@media (max-width:680px){
  .page-title{font-size:26px;}
  .page-sub{font-size:11px;}
  .lead-title{font-size:32px;}
  .lead-quote{font-size:14px;}
  .lead-actions .btn{flex:1 1 auto;}
  .lead-actions .text-link{flex-basis:100%;justify-content:flex-start;}
  .mode-tabs{padding:3px;gap:2px;}
  .mode-tab{padding:0 10px;font-size:12px;}
  .rail{grid-template-columns:1fr;}
  .rail-card:last-child{grid-column:auto;}
  .route-track{grid-template-columns:1fr;}
  .register-name{font-size:15px;}
  .register-desc{white-space:normal;}
  .reading-card{padding:22px 20px;}
  .reading-title{font-size:21px;}
  .result-score{padding:26px 24px;}
  .result-score strong{font-size:80px;}
  .doc-body h2{font-size:30px;}
  .article-page h2{font-size:30px;}
  .feature-title{font-size:28px;}
  .region-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .admit-band h2{font-size:30px;}
  .admit-rules{grid-template-columns:1fr;}
  .admit-actions{flex-direction:column;align-items:stretch;}
  .admit-actions .btn{width:100%;}
  .toast{bottom:84px;}
}
@media (max-width:420px){
  .viewport{padding:22px 16px 100px;}
  .topbar{padding:0 16px;}
  .lead{padding:22px 18px;}
  .lead-title{font-size:30px;}
  .lead-actions .btn{width:100%;}
  .page-title{font-size:24px;}
  .result-score strong{font-size:72px;}
  .region-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media (prefers-reduced-motion:reduce){
  .view.is-active{animation:none;}
  .reading-card:hover,.register-row:hover,.article-card:hover,.video-card:hover{transform:none;}
}

</style>
</head>
<body>
<a class="skip" href="#viewport">跳到主要内容</a>
<div class="app">
  <aside class="sidebar" data-od-id="app-sidebar">
    <button class="brand" data-act="go-home" aria-label="返回学习总览">
      <span class="brand-mark">D</span>
      <span class="brand-text">
        <strong>三轮车驾考</strong>
        <span>D 照 · 三轮摩托车</span>
      </span>
    </button>

    <button class="region-card" data-act="go-bank" title="题库与地区设置">
      <span class="region-label">当前题库</span>
      <span class="region-line">
        <svg class="od-icon" style="--od-icon-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
        <b id="regionName">江苏</b>
        <span class="region-arrow">
          <svg class="od-icon" style="--od-icon-size:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </span>
      </span>
      <span class="region-meta" id="regionMeta">v2026.10.08 · 已校验</span>
    </button>

    <nav class="nav" id="mainNav" aria-label="主导航">
      <p class="nav-label">学习</p>
      <button class="nav-item is-active" data-view="home">
        <span class="nav-index">01</span>
        <svg class="od-icon" style="--od-icon-size:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M9.5 20v-5.5h5V20"/></svg>
        <span>学习总览</span>
      </button>
      <button class="nav-item" data-view="practice">
        <span class="nav-index">02</span>
        <svg class="od-icon" style="--od-icon-size:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h11M8 12h11M8 18h11"/><circle cx="4.4" cy="6" r="1"/><circle cx="4.4" cy="12" r="1"/><circle cx="4.4" cy="18" r="1"/></svg>
        <span>题库练习</span>
      </button>
      <button class="nav-item" data-view="exam">
        <span class="nav-index">03</span>
        <svg class="od-icon" style="--od-icon-size:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5M9 3h6"/></svg>
        <span>模拟考试</span>
      </button>
      <p class="nav-label">资料</p>
      <button class="nav-item" data-view="tutorial">
        <span class="nav-index">04</span>
        <svg class="od-icon" style="--od-icon-size:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="m10 9.5 5 3.5-5 3.5z"/></svg>
        <span>图文 / 视频教程</span>
      </button>
      <button class="nav-item" data-view="column">
        <span class="nav-index">05</span>

{i:'k1-saf-24',c:'safety',t:'judge',q:'行车中遇盲人横过道路，应当减速慢行，必要时停车让行。',o:['正确','错误'],a:[0],e:'遇盲人、老人、儿童等弱势交通参与者，应减速慢行、主动让行，必要时停车等待。',b:'文明驾驶要求'},
{i:'k1-saf-25',c:'safety',t:'single',q:'夜间通过没有路灯的交叉路口时，应当怎样使用灯光？',o:['交替使用远近光灯示意','持续使用远光灯','关闭灯光以便观察','只开启示廓灯'],a:[0],e:'夜间通过急弯、坡路、拱桥、人行横道或者没有交通信号灯控制的路口时，应交替使用远近光灯示意。',b:'《道路交通安全法实施条例》第五十九条'},

/* 科目一 · 机动车基础知识与操作 */
{i:'k1-veh-01',c:'vehicle',t:'single',q:'出车前检查时，下列哪一组项目最应当重点确认？',o:['轮胎气压、制动、转向、灯光和喇叭','车内音响和空调','车身贴纸和装饰','座椅套的清洁度'],a:[0],e:'出车前应检查轮胎、制动、转向、灯光、喇叭、后视镜等安全装置，确认技术状况良好。',b:'安全行车常识'},
{i:'k1-veh-02',c:'vehicle',t:'single',q:'轮胎气压长期偏低，会带来什么后果？',o:['油耗增加、轮胎磨损加剧，容易爆胎','车辆更省油','制动距离缩短','转向更灵活'],a:[0],e:'气压不足会增大滚动阻力，导致油耗上升、胎体过度变形发热，加剧磨损并增加爆胎风险。',b:'车辆维护常识'},
{i:'k1-veh-03',c:'vehicle',t:'single',q:'行车中机油压力报警灯亮起，应当怎么做？',o:['立即安全停车熄火，检查机油','继续行驶到目的地再检查','加速行驶让机油循环','关闭报警灯继续行驶'],a:[0],e:'机油压力报警灯亮表示润滑系统可能失去压力，应立即安全停车熄火检查，避免发动机损坏。',b:'仪表与警告灯'},
{i:'k1-veh-04',c:'vehicle',t:'single',q:'制动系统警告灯亮起，可能的原因是什么？',o:['制动液不足或驻车制动未完全松开','车速过快','轮胎气压过高','蓄电池电量充足'],a:[0],e:'制动警告灯亮通常表示制动液液位过低、制动系统故障或驻车制动未完全释放，应及时检查。',b:'仪表与警告灯'},
{i:'k1-veh-05',c:'vehicle',t:'single',q:'离合器的主要作用是什么？',o:['平顺地切断和传递发动机动力','增大发动机功率','降低轮胎磨损','控制灯光'],a:[0],e:'离合器用于平顺地切断和接合发动机与传动系统的动力，便于起步和换挡。',b:'机动车构造基础'},
{i:'k1-veh-06',c:'vehicle',t:'single',q:'行驶中换挡时，挡位应当与什么相匹配？',o:['车速','车身颜色','载客人数','天气状况'],a:[0],e:'挡位应与车速和发动机转速相匹配，低速高挡或高速低挡都会损伤车辆并影响安全。',b:'驾驶操作基础'},
{i:'k1-veh-07',c:'vehicle',t:'judge',q:'转弯或变道完成后，应当及时关闭转向灯。',o:['正确','错误'],a:[0],e:'转向完成后应及时关闭转向灯，长时间开启会误导其他交通参与者。',b:'灯光使用规定'},
{i:'k1-veh-08',c:'vehicle',t:'single',q:'调整后视镜时，一般应能看到车身约多少比例？',o:['四分之一','二分之一','全部车身','看不到车身'],a:[0],e:'后视镜应调整到能看到车身约 1/4、其余视野覆盖后方路面的角度，兼顾车身参照和盲区。',b:'驾驶操作基础'},
{i:'k1-veh-09',c:'vehicle',t:'judge',q:'在禁止鸣喇叭的路段，遇前车行驶缓慢可以短促鸣喇叭提示。',o:['正确','错误'],a:[1],e:'禁鸣路段不论何种情况都不得鸣喇叭，应通过减速、保持车距等方式安全通行。',b:'《道路交通安全法实施条例》'},
{i:'k1-veh-10',c:'vehicle',t:'single',q:'佩戴安全头盔时，正确的做法是什么？',o:['选择符合标准的产品并系紧系带','只把头盔扣在头上不系带','选择尺寸偏大的头盔','用普通帽子代替'],a:[0],e:'头盔应选择符合标准、尺寸合适的产品，并系紧系带，否则发生碰撞时容易脱落失去保护作用。',b:'安全防护常识'},
{i:'k1-veh-11',c:'vehicle',t:'judge',q:'轮胎花纹磨损严重时，应当及时更换轮胎。',o:['正确','错误'],a:[0],e:'花纹过浅会显著降低抓地力和排水能力，雨天易发生滑水失控，应及时更换。',b:'车辆维护常识'},
{i:'k1-veh-12',c:'vehicle',t:'single',q:'擅自改变机动车已登记的结构、构造或者特征，属于什么行为？',o:['违法行为','合法改装','无需登记的自主行为','只要不影响安全就合法'],a:[0],e:'任何单位或个人不得拼装机动车或者擅自改变机动车已登记的结构、构造、特征，改装需依法办理登记。',b:'《道路交通安全法》第十六条'},
{i:'k1-veh-13',c:'vehicle',t:'single',q:'电动三轮车充电时，正确的做法是什么？',o:['在通风处充电，避免长时间过充','在密闭室内通宵充电','靠近易燃物充电','使用破损的电线充电'],a:[0],e:'应在通风良好处充电，使用匹配的充电器，避免过充和线路老化引发火灾。',b:'用电安全常识'},
{i:'k1-veh-14',c:'vehicle',t:'single',q:'三轮摩托车载物，长度不得超出车身多少？',o:['0.2 米','0.5 米','1 米','不限'],a:[0],e:'摩托车载物长度不得超出车身 0.2 米，超出部分易与其他车辆、行人发生刮碰。',b:'《道路交通安全法实施条例》第五十四条'},
{i:'k1-veh-15',c:'vehicle',t:'single',q:'驻车制动的主要作用是什么？',o:['停车后防止车辆溜动','行驶中减速','紧急情况下代替行车制动','控制灯光'],a:[0],e:'驻车制动用于车辆停放时保持车辆静止，坡道停车时必须拉紧。',b:'机动车构造基础'},
{i:'k1-veh-16',c:'vehicle',t:'judge',q:'在坡道上停车时，除拉紧驻车制动外，还应采取防溜车措施。',o:['正确','错误'],a:[0],e:'坡道停车应拉紧驻车制动，必要时用垫块塞住车轮，防止车辆溜滑。',b:'安全停车常识'},
{i:'k1-veh-17',c:'vehicle',t:'single',q:'坡道起步时，正确的操作要领是什么？',o:['缓抬离合、缓加油，配合驻车制动防止后溜','猛加油门快速起步','先松制动再抬离合','空挡滑行起步'],a:[0],e:'坡道起步应掌握半联动位置，缓抬离合、缓加油，必要时配合驻车制动，防止车辆后溜或熄火。',b:'驾驶操作基础'},
{i:'k1-veh-18',c:'vehicle',t:'single',q:'行驶中发动机突然熄火，应当怎么做？',o:['握稳车把，开启转向灯，靠边停车检查','立即紧急制动','继续滑行到目的地','反复启动发动机'],a:[0],e:'发动机熄火后应立即握稳车把，利用惯性靠边停车，开启危险报警闪光灯并检查原因。',b:'紧急情况处置'},
{i:'k1-veh-19',c:'vehicle',t:'single',q:'制动时车辆明显跑偏，最可能的原因是什么？',o:['左右制动器制动力不一致','轮胎气压过高','灯光亮度不足','机油过多'],a:[0],e:'制动跑偏多因左右制动器制动力不均、制动管路故障或轮胎气压差异，应及时检修。',b:'车辆维护常识'},
{i:'k1-veh-20',c:'vehicle',t:'single',q:'行驶中前轮突然爆胎，正确的处置方法是什么？',o:['双手握稳车把，缓慢减速，避免急刹和急转','立即猛踩制动','迅速向路边急转','加速冲过'],a:[0],e:'前轮爆胎会导致方向失控，应双手紧握车把保持直线，缓慢减速，待车速降低后靠边停车。',b:'紧急情况处置'},
{i:'k1-veh-21',c:'vehicle',t:'judge',q:'夜间在有路灯、照明良好的道路上行驶，应当使用近光灯。',o:['正确','错误'],a:[0],e:'夜间在有路灯、照明良好的道路上行驶应使用近光灯，避免远光灯影响其他交通参与者。',b:'灯光使用规定'},
{i:'k1-veh-22',c:'vehicle',t:'single',q:'车辆涉水后，制动效果下降，应当如何处理？',o:['低速轻踩制动，使制动片干燥后再正常行驶','立即高速行驶','原地怠速等待','关闭发动机等待'],a:[0],e:'涉水后制动片沾水会导致制动效能下降，应低速轻踩制动使其摩擦发热干燥，确认制动恢复后再正常行驶。',b:'安全驾驶操作要求'},
{i:'k1-veh-23',c:'vehicle',t:'single',q:'行驶前调整后视镜的目的是什么？',o:['扩大后方视野，减少盲区','美观','减少风阻','便于观察车身颜色'],a:[0],e:'合理调整后视镜可以扩大后方视野、减少盲区，是安全变道和超车的前提。',b:'驾驶操作基础'},
{i:'k1-veh-24',c:'vehicle',t:'judge',q:'车辆停放时可以占用人行横道，只要不影响行人绕行。',o:['正确','错误'],a:[1],e:'人行横道、网状线、消防通道等区域禁止停车，不得以“不影响通行”为由占用。',b:'《道路交通安全法》第五十六条'},
{i:'k1-veh-25',c:'vehicle',t:'single',q:'下列哪种驾驶姿势是正确的？',o:['双手握把，身体自然放松，视线看向前方远处','单手扶把，另一只手拿手机','身体后仰，双手离把','双脚离开脚踏'],a:[0],e:'正确姿势为双手握把、双脚置于脚踏、身体自然放松，视线放远，便于观察和及时处置。',b:'驾驶操作基础'}
],
k4: [
/* 科目四 · 安全文明驾驶操作要求 */
{i:'k4-civ-01',c:'civil',t:'single',q:'驾驶三轮摩托车行经人行横道，遇行人正在通过时，应当怎么做？',o:['停车让行，待行人通过后再起步','鸣喇叭示意行人加快通过','从行人身后绕行','加速通过'],a:[0],e:'行经人行横道遇行人正在通过，必须停车让行，这是文明驾驶的底线要求。',b:'《道路交通安全法》第四十七条'},
{i:'k4-civ-02',c:'civil',t:'judge',q:'遇前方机动车停车排队等候，可以借用对向车道超越。',o:['正确','错误'],a:[1],e:'遇前方机动车停车排队或者缓慢行驶时，不得借道超车或者占用对面车道，也不得穿插等候车辆。',b:'《道路交通安全法实施条例》第五十三条'},
{i:'k4-civ-03',c:'civil',t:'single',q:'城市道路发生交通拥堵时，正确的做法是什么？',o:['依次排队通行，不借用非机动车道或人行道','借用非机动车道快速通过','连续鸣喇叭催促','占用对向车道穿插'],a:[0],e:'拥堵时应依次排队、耐心通行，占用非机动车道或人行道会挤占弱势交通参与者的空间，极易引发事故。',b:'文明驾驶要求'},
{i:'k4-civ-04',c:'civil',t:'judge',q:'夜间会车时，应当在距对向来车 150 米以外改用近光灯。',o:['正确','错误'],a:[0],e:'远光灯会造成对向驾驶人瞬间炫目，应在 150 米以外改用近光灯。',b:'《道路交通安全法实施条例》第四十八条'},
{i:'k4-civ-05',c:'civil',t:'single',q:'通过居民小区、村庄路段时，应当如何驾驶？',o:['减速慢行，避免鸣喇叭，随时准备停车','保持原速通过','连续鸣喇叭提醒居民','加速尽快驶离'],a:[0],e:'居民区、村庄行人活动频繁且行为难以预判，应减速慢行、避免噪音，随时准备停车。',b:'文明驾驶要求'},
{i:'k4-civ-06',c:'civil',t:'single',q:'超越同向行驶的非机动车时，应当注意什么？',o:['保持足够的横向安全距离，减速通过','紧贴非机动车快速超越','鸣喇叭迫使其让路','从右侧超越'],a:[0],e:'非机动车稳定性差、易受侧风与路面影响，超越时应减速并保持足够横向距离。',b:'文明驾驶要求'},
{i:'k4-civ-07',c:'civil',t:'judge',q:'超越前车后，可以立即驶回原车道。',o:['正确','错误'],a:[1],e:'超车后应继续行驶一段距离，确认与被超车辆拉开足够安全距离后，再开启右转向灯驶回原车道。',b:'安全超车要求'},
{i:'k4-civ-08',c:'civil',t:'single',q:'同方向有两条以上机动车道，校车在最右侧车道停靠上下学生，位于其他车道的车辆应当怎么做？',o:['减速通过','停车等待','鸣喇叭提醒','加速通过'],a:[0],e:'校车在同方向有两条以上机动车道的道路上停靠时，校车停靠车道后方和相邻车道车辆应停车等待，其他车道车辆应减速通过。',b:'《校车安全管理条例》'},
{i:'k4-civ-09',c:'civil',t:'single',q:'遇公交车靠站上下乘客时，应当注意什么？',o:['减速慢行，注意从公交车前方突然横穿的乘客','紧贴公交车快速通过','鸣喇叭示意公交车让路','占用公交站台通行'],a:[0],e:'公交车会遮挡视线，乘客可能突然从车前横穿，应减速慢行并留出横向距离。',b:'文明驾驶要求'},
{i:'k4-civ-10',c:'civil',t:'judge',q:'遇牲畜占用道路时，应当鸣喇叭将其驱赶。',o:['正确','错误'],a:[1],e:'鸣喇叭可能惊扰牲畜造成失控，应减速慢行，必要时停车等待，待其离开后再通行。',b:'文明驾驶要求'},
{i:'k4-civ-11',c:'civil',t:'multi',q:'变更车道前，应当完成下列哪些操作？',o:['提前开启转向灯','观察内外后视镜','转头观察盲区','确认不影响其他车辆正常行驶'],a:[0,1,2,3],e:'变道四步：开启转向灯、观察后视镜、转头确认盲区、确认安全且不影响他人后平稳变道。',b:'安全变道要求'},
{i:'k4-civ-12',c:'civil',t:'judge',q:'行车中遇老年人横过道路，应当减速或停车让行。',o:['正确','错误'],a:[0],e:'老年人反应和行动较慢，应主动减速、停车让行，不得鸣喇叭催促。',b:'文明驾驶要求'},
{i:'k4-civ-13',c:'civil',t:'single',q:'行车中向车外抛撒物品，属于什么行为？',o:['违法行为，应予禁止','个人自由，不受约束','仅在高速公路上违法','只要不砸到人就合法'],a:[0],e:'向车外抛撒物品属于违法行为，既污染环境，也可能直接造成后方车辆、行人受伤。',b:'《道路交通安全法实施条例》第六十二条'},
{i:'k4-civ-14',c:'civil',t:'single',q:'夜间通过急弯、坡路时，应当怎样使用灯光？',o:['交替使用远近光灯示意','持续使用远光灯','关闭前照灯','只开启示廓灯'],a:[0],e:'夜间通过急弯、坡路、拱桥、人行横道或无信号灯路口，应交替使用远近光灯示意，提醒对向和横向来车。',b:'《道路交通安全法实施条例》第五十九条'},
{i:'k4-civ-15',c:'civil',t:'single',q:'遇交通管制时，应当怎么做？',o:['服从交通警察指挥，按指定路线通行','自行选择绕行路线','强行通过管制区域','停车观望等待'],a:[0],e:'遇交通管制应服从现场交通警察指挥，按指定路线、时间通行。',b:'《道路交通安全法》第三十九条'},

/* 科目四 · 恶劣天气与复杂道路 */
{i:'k4-wea-01',c:'weather',t:'judge',q:'雨天路面湿滑，制动距离会比干燥路面明显延长。',o:['正确','错误'],a:[0],e:'雨水使轮胎与路面附着力下降，制动距离显著延长，应降低车速、增大跟车距离。',b:'恶劣天气驾驶'},
{i:'k4-wea-02',c:'weather',t:'multi',q:'大雨天气能见度小于 100 米时，应当开启哪些灯光？',o:['雾灯','近光灯','示廓灯和前后位灯','危险报警闪光灯'],a:[0,1,2,3],e:'能见度小于 100 米时，应开启雾灯、近光灯、示廓灯、前后位灯和危险报警闪光灯，车速不得超过 40 公里/小时。',b:'《道路交通安全法实施条例》第八十一条'},
{i:'k4-wea-03',c:'weather',t:'single',q:'雾天行车，正确的做法是什么？',o:['开启雾灯和危险报警闪光灯，降低车速，必要时选择安全地点停车','开启远光灯提高亮度','紧跟前车尾灯行驶','在行车道内停车等待'],a:[0],e:'雾天应开启雾灯、危险报警闪光灯，降低车速并加大车距；能见度过低时应驶离行车道，选择安全地点停车。',b:'恶劣天气驾驶'},
{i:'k4-wea-04',c:'weather',t:'single',q:'冰雪路面起步和行驶，应当遵循什么原则？',o:['缓慢起步，低速匀速行驶，避免急加速、急制动、急转向','快速起步防止打滑','保持正常车速行驶','频繁制动试探路面'],a:[0],e:'冰雪路面附着力极低，任何急加速、急制动、急转向都可能导致侧滑，应柔和平稳操作。',b:'恶劣天气驾驶'},
{i:'k4-wea-05',c:'weather',t:'judge',q:'在冰雪路面上制动，应当提前、轻柔地踩下制动踏板。',o:['正确','错误'],a:[0],e:'冰雪路面应提前预判、轻柔制动，必要时采用间歇制动，避免车轮抱死侧滑。',b:'恶劣天气驾驶'},
{i:'k4-wea-06',c:'weather',t:'single',q:'大风天气通过风口、桥梁时，应当怎么做？',o:['双手握稳车把，降低车速，注意横风影响','加速通过减少受风时间','单手扶把腾出手遮挡风沙','靠近道路中心行驶'],a:[0],e:'三轮摩托车受侧风影响明显，通过风口、桥面时应降低车速、双手握稳车把，防止被横风带偏。',b:'恶劣天气驾驶'},
{i:'k4-wea-07',c:'weather',t:'single',q:'沙尘天气行车，应当采取什么措施？',o:['开启雾灯和示廓灯，降低车速，加大跟车距离','开启远光灯','关闭灯光减少扬尘','紧跟前车行驶'],a:[0],e:'沙尘天气能见度低，应开启雾灯、示廓灯提示他人，降低车速并加大车距。',b:'恶劣天气驾驶'},
{i:'k4-wea-08',c:'weather',t:'single',q:'通过积水路段前，首先应当做什么？',o:['观察水深和水底情况，判断是否具备通行条件','直接加速冲过','跟随前车轨迹通过','下车推行'],a:[0],e:'应先观察水深、水流和水底情况，水深超过安全限度或路况不明时不得强行通过。',b:'复杂道路驾驶'},
{i:'k4-wea-09',c:'weather',t:'single',q:'山区道路下长坡时，正确的做法是什么？',o:['提前减速减挡，利用发动机制动控制车速','空挡滑行节省燃油','长时间踩住制动踏板','高速冲坡'],a:[0],e:'下长坡应提前减挡，利用发动机制动控制车速，避免长时间制动导致制动器过热失效。',b:'复杂道路驾驶'},
{i:'k4-wea-10',c:'weather',t:'single',q:'在山区弯道行驶，应当怎么做？',o:['提前减速，靠右行驶，必要时鸣喇叭提示','占用对向车道以增大转弯半径','高速通过减少会车时间','紧贴道路中心线行驶'],a:[0],e:'山区弯道视线受阻，应提前减速、靠右行驶，必要时鸣喇叭提示对向来车，严禁占用对向车道。',b:'复杂道路驾驶'},
{i:'k4-wea-11',c:'weather',t:'multi',q:'在隧道内行驶，下列哪些行为是被禁止的？',o:['超车','掉头','倒车','随意停车'],a:[0,1,2,3],e:'隧道内光线和空间受限，禁止超车、掉头、倒车和随意停车，应开启前照灯并保持安全车距。',b:'复杂道路驾驶'},
{i:'k4-wea-12',c:'weather',t:'judge',q:'夜间行车应当降低车速，并增大跟车距离。',o:['正确','错误'],a:[0],e:'夜间可视距离缩短、判断难度增加，应降低车速、增大跟车距离，并正确使用灯光。',b:'夜间驾驶'},
{i:'k4-wea-13',c:'weather',t:'single',q:'通过可能结冰的桥面时，应当怎么做？',o:['提前减速，匀速通过，避免在桥面上制动或转向','在桥面上急刹试探','加速通过缩短时间','紧跟前车利用其轨迹'],a:[0],e:'桥面通风散热快、更易结冰，应提前减速、匀速直线通过，避免在桥面上制动或转向。',b:'恶劣天气驾驶'},

/* 科目四 · 紧急情况处置 */
{i:'k4-eme-01',c:'emergency',t:'single',q:'行驶中制动突然失灵，应当采取什么措施？',o:['利用发动机制动逐级减挡，配合驻车制动，寻找安全地点停车','立即熄火并猛打方向','连续踩制动踏板等待恢复','跳车逃生'],a:[0],e:'制动失灵应保持冷静，逐级减挡利用发动机制动减速，配合驻车制动，必要时利用路边障碍物摩擦减速。',b:'紧急情况处置'},
{i:'k4-eme-02',c:'emergency',t:'single',q:'行驶中转向突然失控，应当怎么做？',o:['立即减速，开启危险报警闪光灯，平稳制动停车','加速冲出危险区域','猛打方向修正','立即熄火'],a:[0],e:'转向失控时应立即松抬加速踏板、平稳制动减速，开启危险报警闪光灯，尽快靠边停车。',b:'紧急情况处置'},
{i:'k4-eme-03',c:'emergency',t:'single',q:'行驶中车辆起火，首先应当怎么做？',o:['立即停车熄火，迅速离车，初期火灾可用灭火器扑救','继续行驶寻找维修点','打开油箱盖检查','原地怠速等待救援'],a:[0],e:'起火后应立即停车熄火、切断电源，人员迅速撤离；火势较小时可用灭火器扑救，火势较大时应远离并报警。',b:'紧急情况处置'},
{i:'k4-eme-04',c:'emergency',t:'single',q:'车辆落水后，正确的逃生方法是什么？',o:['待车内水位上升、内外压力接近时开门，或使用安全锤破窗逃生','立即用力推门','等待车辆完全沉底','打开后备箱逃生'],a:[0],e:'车辆入水后车门受水压难以推开，应保持冷静，待水位上升至接近车顶、内外压力平衡后开门，或用安全锤击碎侧窗逃生。',b:'紧急情况处置'},
{i:'k4-eme-05',c:'emergency',t:'single',q:'行驶中车辆后轮发生侧滑，应当如何修正方向？',o:['松抬加速踏板，向侧滑方向修正方向','向侧滑相反方向猛打方向','立即紧急制动','加速摆脱侧滑'],a:[0],e:'后轮侧滑时应松抬加速踏板，方向盘（车把）向车尾侧滑的方向修正，待车身回正后再回方向。',b:'紧急情况处置'},
{i:'k4-eme-06',c:'emergency',t:'single',q:'行驶中油门卡滞无法回位，应当怎么做？',o:['立即切断动力或熄火，使用制动平稳停车','继续行驶等待自行恢复','挂入空挡后继续滑行','打开油箱盖泄压'],a:[0],e:'油门卡滞应立即关闭点火开关或切断动力，配合制动平稳停车，停车后检修。',b:'紧急情况处置'},
{i:'k4-eme-07',c:'emergency',t:'judge',q:'碰撞不可避免时，应尽量减小碰撞角度，并保护好头部。',o:['正确','错误'],a:[0],e:'无法避免碰撞时，应尽量使车辆正面、以小角度接触障碍物，同时低头收颌保护头部，减小伤害。',b:'紧急情况处置'},
{i:'k4-eme-08',c:'emergency',t:'single',q:'伤员大量出血时，现场急救应当优先采取什么措施？',o:['用干净敷料加压包扎止血','立即喂水','用力揉搓伤口','等待救护车不做处理'],a:[0],e:'大量出血应迅速用干净敷料直接加压包扎止血，必要时加压包扎近心端，并尽快送医。',b:'现场急救'},
{i:'k4-eme-09',c:'emergency',t:'judge',q:'怀疑伤员骨折时，应立即背起伤员送往医院。',o:['正确','错误'],a:[1],e:'骨折伤员应就地固定伤肢后再搬运，随意搬动可能造成二次损伤，脊柱损伤尤其危险。',b:'现场急救'},
{i:'k4-eme-10',c:'emergency',t:'single',q:'皮肤烧伤后的现场处理，正确的是？',o:['用清洁冷水持续冲洗降温，不要涂抹药膏','涂抹酱油或牙膏','立即挑破水泡','用冰块直接敷在伤口上'],a:[0],e:'烧伤后应尽快用清洁流动冷水冲洗降温，保护创面，不要涂抹不明物质或挑破水泡，及时送医。',b:'现场急救'},
{i:'k4-eme-11',c:'emergency',t:'multi',q:'发生交通事故后，驾驶人应当做好哪些现场处置？',o:['立即停车','保护现场','抢救受伤人员','迅速报警'],a:[0,1,2,3],e:'停车、保护现场、抢救伤员、迅速报警是事故后法定的四项基本处置，缺一不可。',b:'《道路交通安全法》第七十条'},
{i:'k4-eme-12',c:'emergency',t:'single',q:'车辆在隧道内发生故障无法行驶，应当怎么做？',o:['开启危险报警闪光灯，尽量将车移至紧急停车带，人员撤离到安全地带并报警','留在车内等待救援','在行车道内下车检查','倒车退出隧道'],a:[0],e:'隧道内故障应开启危险报警闪光灯，尽量靠边或驶入紧急停车带，人员撤离至安全区域并及时报警。',b:'紧急情况处置'},

{i:'k4-cas-01',c:'case',t:'single',q:'案例：驾驶人下坡转弯时未减速，车辆冲出路面侧翻。该事故的主要违法行为是什么？',o:['超速行驶','疲劳驾驶','酒后驾驶','违法载人'],a:[0],e:'下坡转弯未减速导致车辆失控，属于超速行驶；三轮摩托车重心高，弯道超速极易侧翻。',b:'案例分析'},

{i:'k4-cas-04',c:'case',t:'single',q:'案例：三轮摩托车严重超载，下坡时制动失效。事故的根本原因是什么？',o:['超载导致制动距离延长、制动器过热失效','轮胎气压偏高','灯光不全','未安装后视镜'],a:[0],e:'超载会大幅增加制动负荷，下坡连续制动易导致制动器过热衰减，最终制动失效。',b:'案例分析'},
{i:'k4-cas-05',c:'case',t:'single',q:'案例：事故中未佩戴安全头盔的驾驶人头部重伤。该案例说明什么？',o:['驾乘摩托车必须按规定佩戴安全头盔','头盔只起装饰作用','低速行驶不必戴头盔','只有驾驶人需要戴头盔'],a:[0],e:'头部是摩托车事故中最易受致命伤害的部位，正确佩戴并系紧头盔可显著降低伤亡风险。',b:'案例分析'},
{i:'k4-cas-06',c:'case',t:'judge',q:'案例：驾驶人闯红灯与横向来车相撞，闯红灯一方应承担相应责任。',o:['正确','错误'],a:[0],e:'交通信号灯是路权分配的基本依据，闯红灯一方违反通行规定，应承担相应的事故责任。',b:'案例分析'},

{i:'k4-cas-08',c:'case',t:'judge',q:'案例：货运三轮摩托车车厢内搭载 3 名工人，属于违法载人。',o:['正确','错误'],a:[0],e:'货运机动车车厢不得载人，三轮摩托车载货车厢载人属于违法载人，发生事故后果极为严重。',b:'案例分析'},

{i:'k4-cas-10',c:'case',t:'multi',q:'案例：驾驶人边驾驶边查看手机信息，导致避让不及。分心驾驶会带来哪些后果？',o:['反应时间延长','对路面情况观察不足','车辆容易偏离行驶路线','事故风险显著上升'],a:[0,1,2,3],e:'分心驾驶会同时削弱观察、判断和操作能力，即使只有几秒视线离开路面，也可能驶过数十米盲区。',b:'案例分析'}

   dek:'先认清车，再谈操作。三轮摩托车的操纵部件与两轮车差别不小，出车前的五分钟检查决定了整趟行程的安全底线。',
   steps:['坐上车先确认驻车制动处于拉紧状态，双脚踩实脚踏，双手自然握住车把。','依次识别左侧把手（离合、转向灯、喇叭）、右侧把手（前制动、油门）与脚下踏板（后制动、换挡）。','检查轮胎：气压是否充足、胎面有无异物与裂纹、花纹是否磨到极限标记。','检查制动：分别试前、后制动，手柄与踏板行程不应过长，制动应能可靠抱死。','检查灯光与喇叭：前照灯远近光、转向灯、制动灯、喇叭逐项试一遍。','检查后视镜与货厢：镜面角度是否合适，货厢门锁与捆扎点是否牢靠。'],
   tips:['气压不足会让胎体过度变形发热，是爆胎的常见诱因。','出车前检查不需要工具，一圈走下来，五分钟足够。']},

  {id:'t3', no:'03', title:'绕桩：速度、视线与车把', tag:'科目二', meta:'5 个步骤 · 6 分钟',

   steps:['进入桩区前把车速降到可以用怠速或微油通过的程度，全程不捏离合滑行。','视线不要盯着最近的桩，看向下一个桩的外侧，让车身自然跟随。','接近桩位前 1 米开始转向，车把打到所需角度后保持，不要反复修正。','车身绕过桩后回正车把，为下一段直线留出稳定姿态。','出桩区前保持车速均匀，不要在最后一个桩后突然加速。'],
   tips:['碰擦桩杆、车轮触压边线通常直接不合格，宁可慢，不要抢。','脚不要落地，落地即判不合格。']},

  {id:'t6', no:'06', title:'雨天与湿滑路面', tag:'安全', meta:'5 个要点 · 5 分钟',

   steps:['降低车速，把跟车距离增加到干燥路面的两倍以上。','避免急加速、急制动、急转向，所有操作都提前、轻柔地完成。','通过积水路段先观察水深，低速匀速通过，不要中途停车或换挡。','涉水后低速轻踩制动，让制动片摩擦发热排水，恢复制动效能。','开启前照灯与示廓灯，让其他车辆更早发现你。'],

  {id:'t7', no:'07', title:'夜间与灯光使用', tag:'安全', meta:'5 个要点 · 4 分钟',

const ARTICLES = [
  {id:'a1', cat:'日常使用', title:'三轮车日常检查：五分钟清单', dek:'把检查做成固定动作，比偶尔的大保养更能避免路上抛锚。', meta:'6 项检查 · 阅读 4 分钟',
   body:`<p>三轮摩托车承担的多是载货、接送、短途通勤这类高频任务，车辆状态的变化往往比家用汽车更快。与其等到异响出现再进维修点，不如把检查拆成一套固定动作，每天出车前走一遍。</p>
   <h4>一、轮胎与气压</h4><p>三个轮子逐一按压胎面，观察是否有明显塌陷、裂纹或嵌入的异物。气压不足会让胎体过度变形发热，既增加油耗，也是爆胎的常见诱因。花纹磨到极限标记时应及时更换。</p>
   <h4>二、制动</h4><p>分别试前制动和后制动，手柄与踏板不应有明显空行程。如果制动时需要握到底才有效果，说明制动片磨损或制动液不足，应立即检修。</p>
   <h4>三、灯光与喇叭</h4><p>前照灯远近光、左右转向灯、制动灯、喇叭逐项试一遍。制动灯尤其容易被忽略——它不亮，后车就无法判断你的减速意图。</p>
   <h4>四、转向与紧固件</h4><p>原地左右转动车把，感受是否有卡滞或旷量；检查货厢门锁、绑带固定点、后视镜支架是否松动。</p>
   <h4>五、随车物品</h4><p>头盔、反光背心、简易工具、警示三角牌，按规定位置放好。载货时预留出捆扎绳的位置，不要等装完货才发现没地方固定。</p>
   <div class="callout"><b>一个习惯：</b>把检查顺序固定下来，从车头到车尾绕一圈，最后上车。顺序固定了，就不会漏项。</div>`},
  {id:'a2', cat:'日常使用', title:'装载与重心：为什么货不能堆高', dek:'三轮车有三个轮子，但重心只有一个。装载方式决定了它在弯道里的脾气。', meta:'装载规范 · 阅读 5 分钟',
   body:`<p>三轮摩托车的货厢提供了可观的装载空间，也带来了一个常被忽视的问题：重心。车辆转弯时产生的离心力与重心高度成正比，货堆得越高，侧翻的临界速度就越低。</p>
   <h4>法规给出的边界</h4><p>摩托车载物，高度从地面起不得超过 1.5 米，长度不得超出车身 0.2 米；三轮摩托车载物宽度不得超出车身。这些数字不是建议，而是硬性规定，也是车辆稳定性设计的边界。</p>
   <h4>装载的三个原则</h4><p><b>下重上轻：</b>重物贴近货厢底板，轻货在上，降低整体重心。<b>前后均衡：</b>重心过度后移会让前轮附着力下降，转向发飘；过度前移则会加重前轮与转向机构的负荷。<b>对角捆扎：</b>用绳索对角交叉固定，起步前用手推一推，确认不会晃动。</p>
   <h4>偏载的代价</h4><p>货物偏向一侧时，左右轮载荷严重不均，转弯时外侧车轮更容易离地。很多三轮车侧翻事故并非因为速度多快，而是因为一个看似不高的货堆加上一次并不急促的转向。</p>
   <div class="callout"><b>记住一句话：</b>能装下，不等于能安全运走。超出核定载质量时，制动距离和侧翻风险都会成倍增加。</div>`},
  {id:'a3', cat:'安全驾驶', title:'雨天制动距离，比你想的长得多', dek:'湿滑路面的附着力可能只剩干燥路面的一半，速度带来的制动距离却是平方级增长。', meta:'恶劣天气 · 阅读 4 分钟',
   body:`<p>干燥沥青路面上，摩托车的制动减速度可以达到 0.7g 左右；雨天积水路面上，这个数字可能降到 0.3g 甚至更低。这意味着同样的车速，制动距离会拉长一倍以上。</p>
   <h4>水膜与滑水</h4><p>当车速较高、积水较深时，轮胎来不及把水排开，会在胎面与路面之间形成一层水膜，即“滑水现象”。此时轮胎几乎完全失去附着力，制动和转向都会失效。</p>
   <h4>操作要领</h4><p>降低车速、增大跟车距离是第一位的。所有操作提前完成：提前减速、提前制动、提前转向，避免在弯道中制动。通过积水路段应低速匀速，不要中途停车或换挡；涉水后低速轻踩制动，使制动片摩擦发热排水。</p>
   <h4>容易被忽略的滑点</h4><p>井盖、斑马线漆面、路面油污、落叶和泥浆，在雨天都比普通沥青更滑。尽量让车轮避开这些区域，尤其是转弯时。</p>
   <div class="callout"><b>换算一下：</b>40km/h 时，干燥路面制动距离约 9 米；湿滑路面可能超过 20 米。这多出来的十米，就是安全与事故之间的距离。</div>`},
  {id:'a4', cat:'安全驾驶', title:'头盔怎么选、怎么戴', dek:'头盔只有在系紧系带的那一刻才真正开始工作。', meta:'防护装备 · 阅读 3 分钟',
   body:`<p>摩托车事故中，头部是最容易受到致命伤害的部位。正确佩戴符合标准的头盔，可以显著降低重伤和死亡风险。但“戴了”和“戴对”是两件事。</p>
   <h4>选购</h4><p>选择有强制性产品认证、尺寸合适的产品。戴上后左右摇头，头盔不应明显晃动；前额与头盔内衬应贴合，不能靠后仰的角度“挂”在头上。全盔的防护范围最大，半盔则更适合夏季短途，但都应带面罩或护目镜。</p>
   <h4>佩戴</h4><p>系带必须扣紧，下颌与系带之间以能塞进一根手指为宜。头盔前沿保持在眉毛上方约两指宽，不要遮住视线。发生碰撞时，未系紧的头盔会在第一次撞击中就飞出去，完全失去保护作用。</p>
   <h4>更换</h4><p>头盔受过一次较重的撞击后，即使外观完好，内部缓冲层也可能已经失效，应当更换。一般建议使用 3—5 年更换一次，具体以产品说明为准。</p>
   <div class="callout"><b>法规提醒：</b>摩托车驾驶人及乘坐人员都应当按规定佩戴安全头盔；驾驶摩托车不戴安全头盔的，一次记 1 分。</div>`},
  {id:'a5', cat:'日常使用', title:'电动三轮车充电，别把风险留到夜里', dek:'绝大多数电动三轮车火灾发生在充电过程中，而夜间充电最难被及时发现。', meta:'用电安全 · 阅读 4 分钟',
   body:`<p>电动三轮车的电池容量大、充电时间长，很多用户习惯晚上插上、早上拔掉。这种做法在电池老化或充电器不匹配时，风险会明显上升。</p>
   <h4>充电环境</h4><p>应在通风良好、远离可燃物的地方充电，不要在楼道、楼梯间、地下室或卧室内充电。充电器应放在平稳、散热良好的位置，不要覆盖衣物或放在坐垫上。</p>
   <h4>充电器与线路</h4><p>使用与电池匹配的原厂或合格充电器，不要混用不同电压的充电器。检查插头、线缆有无破损、发热、焦糊味，发现异常立即停止使用。</p>
   <h4>充电时长</h4><p>避免长时间过充，一般充满后应及时断开。电池出现鼓包、续航明显下降、充电异常发热时，应到正规维修点检测，不要自行拆解。</p>
   <div class="callout"><b>一条底线：</b>不要把电动三轮车停放在疏散通道、安全出口或楼梯间内，无论是否在充电。</div>`},
  {id:'a6', cat:'法规常识', title:'常见违法与记分速查', dek:'把最容易踩的几条记牢，比临考前突击一整章更有效。', meta:'法规速查 · 阅读 3 分钟',
   body:`<p>以下为三轮摩托车驾驶中最常见的违法行为与记分标准，供日常自查。具体处罚以现行法规和当地执行标准为准。</p>
   <h4>一次记 12 分</h4><p>饮酒后驾驶机动车；使用伪造、变造的机动车号牌、行驶证、驾驶证；造成致人轻伤以上或死亡的交通事故后逃逸尚不构成犯罪的。</p>
   <h4>一次记 9 分</h4><p>驾驶与准驾车型不符的机动车；上道路行驶的机动车未悬挂号牌，或故意遮挡、污损号牌。</p>
   <h4>一次记 6 分</h4><p>闯红灯；在高速公路、城市快速路上超速 20% 以上未达 50%；占用应急车道行驶。</p>

/* ══ 练习 ═════════════════════════════════════════════════════════════ */
let P = null;

function buildPractice(mode){
  const subj = S.subject;
  let list, chapter = null;
  if(mode === 'wrong') list = BANK[subj].filter(q=>S.wrong.includes(q.i));
  else if(mode === 'fav') list = BANK[subj].filter(q=>S.fav.includes(q.i));
  else if(mode === 'chapter'){
    chapter = S.pchapter;
    list = BANK[subj].filter(q=>q.c===chapter);
  }
  else if(mode === 'random') list = shuffle(BANK[subj].slice());
  else list = BANK[subj].slice();

  let idx = 0;
  if(mode === 'sequence' && list.length) idx = clamp(S.lastPos[subj]||0, 0, list.length-1);
  P = {subj, mode, chapter, list, idx, picked:[], checked:false, ok:null, answers:{}, answered:0, correct:0, done:false};
  if(mode === 'sequence') S.lastPos[subj] = idx;
}

function ensurePractice(){
  if(S.pmode !== 'wrong' && S.pmode !== 'fav' && S.pmode !== 'random' && S.pmode !== 'chapter') S.pmode = 'sequence';
  if(S.pmode === 'chapter' && !CHAPTERS[S.subject].some(c=>c.k===S.pchapter)){
    S.pchapter = CHAPTERS[S.subject][0].k;
  }
  if(!P || P.subj !== S.subject || P.mode !== S.pmode || (P.mode === 'chapter' && P.chapter !== S.pchapter)){
    buildPractice(S.pmode);
  }
}

function startPractice(mode){
  const m = mode || 'sequence';
  const same = P && P.mode === m && P.subj === S.subject && !P.done;
  S.pmode = m;
  if(S.pmode === 'chapter' && !CHAPTERS[S.subject].some(c=>c.k===S.pchapter)){
    S.pchapter = CHAPTERS[S.subject][0].k;
  }
  if(!same) P = null;
  save();
  go('practice');
}

function startChapter(chapter){
  S.pmode = 'chapter';
  S.pchapter = chapter;
  P = null;
  save();
  go('practice');
}

function restartRound(){
  if(!P){ buildPractice(S.pmode); renderPractice(); return; }
  P.idx = 0;
  P.picked = [];
  P.checked = false;
  P.ok = null;
  P.answers = {};
  P.answered = 0;
  P.correct = 0;
  P.done = false;
  if(P.mode === 'sequence') S.lastPos[P.subj] = 0;
  save();
  renderPractice();
}

function currentQ(){ return P && P.list[P.idx] ? P.list[P.idx] : null; }

function pickPractice(i){
  if(!P || P.done || P.checked) return;
  const q = currentQ();
  if(!q || i >= q.o.length) return;
  if(q.t === 'multi'){
    const at = P.picked.indexOf(i);
    if(at > -1) P.picked.splice(at,1); else P.picked.push(i);
    P.picked.sort((a,b)=>a-b);
    renderPractice();
  } else {
    P.picked = [i];
    checkPractice();
  }
}

function checkPractice(){
  if(!P || P.done || P.checked) return;
  const q = currentQ();
  if(!q || !P.picked.length) return;
  const ok = P.picked.length === q.a.length && q.a.every(a=>P.picked.includes(a));
  P.checked = true;
  P.ok = ok;
  P.answers[q.i] = {pick: P.picked.slice(), ok};
  P.answered = Object.keys(P.answers).length;
  P.correct = Object.values(P.answers).filter(a=>a.ok).length;
  recordAnswer(q, ok, P.picked);
  if(P.mode === 'sequence') S.lastPos[P.subj] = P.idx;
  save();
  syncChrome();
  renderPractice();
}

function goIdx(n){
  if(!P) return;
  P.idx = clamp(n, 0, P.list.length-1);
  const q = currentQ();
  const a = q ? P.answers[q.i] : null;
  P.picked = a ? a.pick.slice() : [];
  P.checked = !!a;
  P.ok = a ? a.ok : null;
  if(P.mode === 'sequence') S.lastPos[P.subj] = P.idx;
  save();
  renderPractice();
}

function practiceNext(){
  if(!P) return;
  if(P.idx < P.list.length-1) goIdx(P.idx+1);
  else { P.done = true; save(); renderPractice(); }
}

function practicePrev(){
  if(!P || P.idx === 0) return;
  goIdx(P.idx-1);
}

function toggleFav(){
  if(!P || P.done) return;
  const q = currentQ();
  if(!q) return;
  const at = S.fav.indexOf(q.i);
  if(at > -1) S.fav.splice(at,1); else S.fav.push(q.i);
  save();
  renderPractice();
  toast(at > -1 ? '已取消收藏' : '已加入收藏夹');
}

function practiceBody(){
  if(!P.list.length){
    const isWrong = P.mode === 'wrong', isFav = P.mode === 'fav';
    return `<div class="card empty-state">
      <div class="empty-icon">${icon(isWrong?'check':isFav?'star':'practice','24px')}</div>
      <strong>${isWrong ? '错题本还是空的' : isFav ? '收藏夹还是空的' : '当前条件下没有题目'}</strong>
      <p>${isWrong ? '答错的题目会自动收进这里，随时回来复习。' : isFav ? '在练习中点击题目右上角的星标，即可收藏本题。' : '换一个章节或模式再试试。'}</p>
      <div class="state-actions">
        <button class="btn btn-primary" data-act="practice-mode" data-mode="sequence">开始顺序练习</button>
        <button class="btn btn-secondary" data-act="go-home">返回总览</button>
      </div>
    </div>`;
  }

  if(P.done){
    return `<div class="card done-state">
      <div class="empty-icon">${icon('check','26px')}</div>
      <div class="big-num">${pct(P.correct, P.answered)}<small>%</small></div>
      <p>本轮共作答 ${P.answered} 题 · 答对 ${P.correct} 题 · 共 ${P.list.length} 题</p>
      <div class="state-actions">
        <button class="btn btn-primary" data-act="practice-restart">再练一轮</button>
        <button class="btn btn-secondary" data-act="practice-mode" data-mode="wrong">复习错题</button>
        <button class="btn btn-ghost" data-act="go-home">返回总览</button>
      </div>
    </div>`;
  }

  const q = currentQ();
  const isMulti = q.t === 'multi';
  const fav = S.fav.includes(q.i);
  const opts = q.o.map((o,i)=>{
    let cls = '';
    const right = q.a.includes(i);
    if(P.checked){
      if(right) cls = 'is-right';
      else if(P.picked.includes(i)) cls = 'is-wrong';
    } else if(P.picked.includes(i)) cls = 'is-picked';

    let mark = '';
    if(P.checked){
      if(right) mark = '正确答案';
      else if(P.picked.includes(i)) mark = '你的选择';
    }
    return `<button class="opt ${cls}" data-pick="${i}" aria-pressed="${P.picked.includes(i)}" ${P.checked?'disabled':''}>
      <span class="opt-k">${LETTERS[i]}</span>
      <span class="opt-t">${esc(o)}</span>
      ${mark ? `<span class="opt-mark">${mark}</span>` : ''}
    </button>`;
  }).join('');

  const verdict = P.checked
    ? `<div class="verdict ${P.ok?'ok':'err'}" role="status">
        <span class="verdict-icon">${icon(P.ok?'check':'close','15px')}</span>
        <div>
          <strong>${P.ok?'回答正确':'回答错误'}</strong>
          <span>${P.ok?'这题已计入掌握记录':'已加入错题本，稍后可以集中复习'}</span>
        </div>
      </div>
      <div class="explain">
        <h4>解析</h4>
        <p>${esc(q.e)}</p>
        <div class="basis">依据 · ${esc(q.b)}</div>
      </div>`
    : '';

  return `<div class="card qcard">
    <div class="qbar">
      <span class="qidx">第 ${P.idx+1} / ${P.list.length} 题</span>
      <span class="tag">${typeLabel(q.t)}</span>
      <span class="tag tag-line">${esc(chapterName(P.subj, q.c))}</span>
      <span class="spacer"></span>
      <button class="icon-btn ${fav?'is-fav':''}" data-act="practice-fav" title="${fav?'取消收藏':'收藏本题'}" aria-label="${fav?'取消收藏':'收藏本题'}">
        ${starIcon(fav)}
      </button>
    </div>
    <h2 class="stem">${esc(q.q)}</h2>
    ${q.sign ? `<div class="sign">${SIGNS[q.sign]}</div>` : ''}
    <div class="opts">${opts}</div>
    ${verdict}
    <div class="qfoot">
      <span class="hint">${P.checked ? 'Enter 进入下一题' : isMulti ? '多选题 · 选好后确认' : '点击选项即判定对错'}</span>
      <div class="nav-btns">
        <button class="btn btn-secondary btn-sm" data-act="practice-prev" ${P.idx===0?'disabled':''}>上一题</button>
        ${P.checked
          ? `<button class="btn btn-primary btn-sm" data-act="practice-next">${P.idx===P.list.length-1?'完成本轮':'下一题'}</button>`
          : isMulti
            ? `<button class="btn btn-primary btn-sm" data-act="practice-check" ${P.picked.length?'':'disabled'}>确认答案</button>`
            : `<button class="btn btn-ghost btn-sm" data-act="practice-next">跳过</button>`}
      </div>
    </div>
  </div>`;
}

/* ══ 通用工具 ═════════════════════════════════════════════════════════ */
const LETTERS = ['A','B','C','D','E','F'];
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
function qById(subj, id){ return BANK[subj].find(q=>q.i===id) || null; }
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtClock(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}
function recordAnswer(q, ok, pick){
  S.seen[q.i] = {ok, pick: pick.slice()};
  const at = S.wrong.indexOf(q.i);
  if(ok && at > -1) S.wrong.splice(at,1);
  if(!ok && at === -1) S.wrong.push(q.i);
}

/* ══ 模拟考试 ═════════════════════════════════════════════════════════ */
function startExam(){
  const subj = S.subject, meta = SUBJECTS[subj];
  const items = shuffle(BANK[subj].map(q=>q.i));
  const now = Date.now();
  S.exam = {
    subj, items, answers:{}, flags:[], idx:0,
    started:now, endsAt:now + meta.minutes*60000, state:'running'
  };
  save();
  go('exam');
  toast(`${meta.name}模拟考试开始，限时 ${meta.minutes} 分钟`);
}

function examAnswered(ex){
  return ex.items.filter(id=>(ex.answers[id]||[]).length).length;
}

function examPick(i){
  const ex = S.exam;
  if(!ex || ex.state !== 'running') return;
  const q = qById(ex.subj, ex.items[ex.idx]);
  if(!q || i >= q.o.length) return;
  const cur = ex.answers[q.i] || [];
  if(q.t === 'multi'){
    const at = cur.indexOf(i);
    if(at > -1) cur.splice(at,1); else cur.push(i);
    cur.sort((a,b)=>a-b);
    ex.answers[q.i] = cur;
  } else {
    ex.answers[q.i] = [i];
  }
  save();
  renderExam();
}

function examMove(dir){
  const ex = S.exam;
  if(!ex || ex.state !== 'running') return;
  ex.idx = clamp(ex.idx + dir, 0, ex.items.length-1);
  save();
  renderExam();
}

function examJump(i){
  const ex = S.exam;
  if(!ex || ex.state !== 'running') return;
  ex.idx = clamp(i, 0, ex.items.length-1);
  save();
  renderExam();
}

function toggleFlag(){
  const ex = S.exam;
  if(!ex || ex.state !== 'running') return;
  const id = ex.items[ex.idx];
  const at = ex.flags.indexOf(id);
  if(at > -1) ex.flags.splice(at,1); else ex.flags.push(id);
  save();
  renderExam();
}

function askSubmit(){
  const ex = S.exam;
  if(!ex || ex.state !== 'running') return;
  const un = ex.items.length - examAnswered(ex);
  openModal('确认交卷', `
    <p class="modal-copy">
      本次共 ${ex.items.length} 题，已答 ${examAnswered(ex)} 题${un ? `，还有 <b style="color:var(--red-ink)">${un} 题未作答</b>` : '，全部题目已作答'}。
      交卷后立即评分，未作答的题目按错误计入成绩。
    </p>`,
    `<button class="btn btn-secondary" data-act="close-modal">继续答题</button>
     <button class="btn btn-primary" data-act="exam-confirm-submit">确认交卷</button>`);
}

function submitExam(auto){
  const ex = S.exam;
  if(!ex || ex.state !== 'running') return;
  const meta = SUBJECTS[ex.subj];
  let correct = 0, answered = 0;
  const wrong = [];

  ex.items.forEach(id=>{
    const q = qById(ex.subj, id);
    if(!q) return;
    const pick = (ex.answers[id] || []).slice();
    const ok = pick.length === q.a.length && q.a.every(a=>pick.includes(a));
    if(pick.length){ answered++; recordAnswer(q, ok, pick); }
    else if(!S.wrong.includes(q.i)) S.wrong.push(q.i);
    if(ok) correct++;
    else wrong.push({id, pick});
  });

  const score = correct * meta.per;
  const pass = score >= meta.pass;
  const used = fmtClock(Math.min(Date.now() - ex.started, meta.minutes*60000));

  ex.state = 'done';
  ex.result = {score, correct, total:ex.items.length, answered, pass, used, wrong, date:todayStr()};
  S.exams.push({subject:ex.subj, score, total:ex.items.length, pass, used, date:todayStr()});
  save();
  renderExam();
  syncChrome();
  if(auto) toast('考试时间到，已自动交卷');
}

function examRunning(){
  const ex = S.exam, meta = SUBJECTS[ex.subj];
  const q = qById(ex.subj, ex.items[ex.idx]);
  if(!q) return `<div class="card"><div class="empty-state"><strong>题目不存在</strong><p>请重新开始考试。</p></div></div>`;
  const pick = ex.answers[q.i] || [];
  const flagged = ex.flags.includes(q.i);
  const left = ex.endsAt - Date.now();

  const sheet = ex.items.map((id,i)=>{
    const cls = [];
    if((ex.answers[id]||[]).length) cls.push('done');
    if(i === ex.idx) cls.push('cur');
    if(ex.flags.includes(id)) cls.push('flag');
    return `<button class="${cls.join(' ')}" data-jump="${i}" aria-label="第 ${i+1} 题">${i+1}</button>`;
  }).join('');

  const opts = q.o.map((o,i)=>{
    const on = pick.includes(i);
    return `<button class="opt ${on?'is-picked':''}" data-epick="${i}" aria-pressed="${on}">
      <span class="opt-k">${LETTERS[i]}</span>
      <span class="opt-t">${esc(o)}</span>
      ${on ? '<span class="opt-mark">已选</span>' : ''}
    </button>`;
  }).join('');

  return `

      <div class="timer ${left <= 300000 ? 'is-low' : ''}" id="examTimer" role="timer" aria-label="剩余时间">

      <span class="tag">${esc(meta.name)}</span>
      <span class="tag tag-line">${typeLabel(q.t)}</span>

            ${flagIcon(flagged)}

        ${q.sign ? `<div class="sign">${SIGNS[q.sign]}</div>` : ''}

          <span class="hint">${q.t==='multi' ? '多选题 · 可选择多个答案' : q.t==='judge' ? '判断题 · 按 A / B 或数字键作答' : '单选题 · 按 A — D 或数字键作答'}${flagged?' · 已标记疑问':''}</span>
          <div class="nav-btns">
            <button class="btn btn-secondary btn-sm" data-act="exam-prev" ${ex.idx===0?'disabled':''}>上一题</button>
            <button class="btn btn-secondary btn-sm" data-act="exam-next" ${ex.idx===ex.items.length-1?'disabled':''}>下一题</button>

function examResult(){
  const ex = S.exam, meta = SUBJECTS[ex.subj], r = ex.result;
  if(!r) return examIdle();
  const items = r.wrong.map(w=>{
    const q = qById(ex.subj, w.id);
    return q ? {q, pick:w.pick} : null;
  }).filter(Boolean);

  const review = items.length ? items.map((it, idx)=>{
    const q = it.q, pick = it.pick;
    const mine = pick.length ? pick.map(i=>LETTERS[i]).join('') : '未作答';
    const right = q.a.map(i=>LETTERS[i]).join('');
    return `<div class="review-item">
      <div class="review-q">${idx+1}. ${esc(q.q)}</div>
      <div class="review-a">
        <span>你的答案 <del>${mine}</del></span>
        <span>正确答案 <b>${right}</b></span>
        <span>${esc(chapterName(ex.subj, q.c))}</span>
      </div>
      <div class="review-exp">${esc(q.e)}</div>
    </div>`;
  }).join('') : `<div class="empty-state"><div class="empty-icon">${icon('check','26px')}</div><strong>全部答对</strong><p>本次没有错题，保持这个状态。</p></div>`;

  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">模拟考试结果</h1>
        <p class="page-sub">${esc(meta.name)} · ${esc(r.date)} · 用时 ${r.used}</p>
      </div>
      <div class="page-tools">
        <button class="btn btn-secondary" data-act="go-home">返回总览</button>
        <button class="btn btn-primary" data-act="exam-retry">再考一次</button>
      </div>
    </div>

    <div class="result-hero ${r.pass?'':'fail'}" data-od-id="exam-result">
      <div class="result-score">
        <span class="result-label">本次成绩</span>
        <strong>${r.score}<small>分</small></strong>
        <span class="stamp">${r.pass?'合格':'未合格'}</span>
      </div>
      <div class="result-stats">
        <div class="stat"><span class="stat-k">答对</span><span class="stat-v">${r.correct}<small>/ ${r.total}</small></span><span class="stat-f">正确率 ${pct(r.correct,r.total)}%</span></div>
        <div class="stat"><span class="stat-k">答错</span><span class="stat-v">${r.answered-r.correct}<small>题</small></span><span class="stat-f">已加入错题本</span></div>
        <div class="stat"><span class="stat-k">未答</span><span class="stat-v">${r.total-r.answered}<small>题</small></span><span class="stat-f">按错误计分</span></div>
        <div class="stat"><span class="stat-k">用时</span><span class="stat-v">${r.used}</span><span class="stat-f">限时 ${meta.minutes} 分钟</span></div>
      </div>
    </div>

    <div class="exam-grid">
      <div class="card">
        <div class="card-head"><h3>错题解析</h3><span class="hint">${items.length} 题</span></div>
        ${review}
      </div>
      <aside class="rail">
        <div class="rail-card">
          <div class="rail-head"><h3>成绩构成</h3></div>
          <div class="rail-body">

function renderExam(){
  if(S.exam && !SUBJECTS[S.exam.subj]) S.exam = null;
  if(S.exam && S.exam.state === 'running'){
    $('#view-exam').innerHTML = examRunning();
    updateExamClock();
  } else if(S.exam && S.exam.state === 'done' && S.exam.result){
    $('#view-exam').innerHTML = examResult();
  } else {
    if(S.exam) S.exam = null;
    $('#view-exam').innerHTML = examIdle();
  }
}

function updateExamClock(){
  const ex = S.exam;
  if(!ex || ex.state !== 'running') return;
  const el = $('#examTimer');
  if(!el) return;
  const left = Math.max(0, ex.endsAt - Date.now());
  const b = el.querySelector('b');
  if(b) b.textContent = fmtClock(left);
  el.classList.toggle('is-low', left <= 300000);
}

function tickExam(){
  const ex = S.exam;
  if(!ex || ex.state !== 'running') return;
  if(Date.now() >= ex.endsAt){ submitExam(true); return; }
  updateExamClock();
}

/* ══ 视图切换与外壳 ═══════════════════════════════════════════════════ */
const VIEW_TITLES = {
  home:'学习总览', practice:'题库练习', exam:'模拟考试',
  tutorial:'图文 / 视频教程', column:'安全驾驶专栏', bank:'题库与地区'
};

function setSubject(subj){
  if(!SUBJECTS[subj] || S.subject === subj) return;
  if(S.exam && S.exam.state === 'running'){
    toast('模拟考试进行中，交卷后再切换科目');
    return;
  }
  if(S.exam) S.exam = null;
  S.subject = subj;
  S.pchapter = CHAPTERS[subj][0].k;
  P = null;
  save();
  go(S.view);
}

function renderCurrent(){
  if(S.view === 'practice') renderPractice();
  else if(S.view === 'exam') renderExam();
  else if(S.view === 'tutorial') renderTutorial();
  else if(S.view === 'column') renderColumn();
  else if(S.view === 'bank') renderBank();
  else renderHome();
}

function go(view){
  if(!$('#view-' + view)) view = 'home';
  S.view = view;
  save();
  $$('.view').forEach(v=>v.classList.toggle('is-active', v.id === 'view-' + view));
  syncChrome();
  renderCurrent();
  const vp = $('#viewport');
  if(vp) vp.scrollTop = 0;
  window.scrollTo(0, 0);
}

function syncChrome(){
  const title = VIEW_TITLES[S.view] || '学习总览';
  $$('.nav-item[data-view]').forEach(b=>{
    const on = b.dataset.view === S.view;
    b.classList.toggle('is-active', on);
    if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  const crumb = $('#crumbTitle');
  if(crumb) crumb.textContent = title;
  const ctx = $('#topContext');
  if(ctx) ctx.textContent = `${S.region} · ${SUBJECTS[S.subject].name}`;
  const region = $('#regionName');
  if(region) region.textContent = S.region;
  const st = statsOf(S.subject);
  const top = $('#topStats');
  if(top) top.innerHTML = `累计 <b>${st.seen}</b> 题 · 正确率 <b>${st.acc}%</b>`;
  $$('#subjectSeg button').forEach(b=>{
    const on = b.dataset.subject === S.subject;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-pressed', String(on));
  });
  document.title = `${title} · 三轮车驾考`;
}

let modalFocus = null;

function openModal(title, body, foot){
  modalFocus = document.activeElement;
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  $('#modalFoot').innerHTML = foot || '<button class="btn btn-secondary" data-act="close-modal">关闭</button>';
  $('#scrim').hidden = false;
  const box = $('#scrim .modal');
  if(box && box.focus) box.focus();
}

function closeModal(){
  $('#scrim').hidden = true;
  const back = modalFocus;
  modalFocus = null;
  if(back && back.isConnected && typeof back.focus === 'function') back.focus();
}

let toastTimer = null;
function toast(msg){
  const el = $('#toast');
  $('#toastText').textContent = msg;
  el.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('is-on'), 2200);
}

document.addEventListener('click', e=>{
  const nav = e.target.closest('.nav-item[data-view]');
  if(nav){ go(nav.dataset.view); return; }

  const subj = e.target.closest('button[data-subject]');
  if(subj){ setSubject(subj.dataset.subject); return; }

  const pick = e.target.closest('[data-pick]');
  if(pick){ pickPractice(Number(pick.dataset.pick)); return; }

  const epick = e.target.closest('[data-epick]');
  if(epick){ examPick(Number(epick.dataset.epick)); return; }

  const jump = e.target.closest('[data-jump]');
  if(jump){ examJump(Number(jump.dataset.jump)); return; }

  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act, d = btn.dataset;

  switch(act){
    case 'go-home': go('home'); break;
    case 'go-exam': go('exam'); break;
    case 'go-tutorial': go('tutorial'); break;
    case 'go-column': go('column'); break;
    case 'go-bank': go('bank'); break;
    case 'start-practice': startPractice(d.mode || 'sequence'); break;
    case 'practice-mode': startPractice(d.mode); break;
    case 'start-chapter': startChapter(d.chapter); break;
    case 'practice-chapter':
      S.pchapter = d.chapter; P = null; save(); renderPractice(); break;
    case 'practice-check': checkPractice(); break;
    case 'practice-next': practiceNext(); break;
    case 'practice-prev': practicePrev(); break;
    case 'practice-restart': restartRound(); break;
    case 'practice-fav': toggleFav(); break;
    case 'exam-start': startExam(); break;
    case 'exam-submit': askSubmit(); break;
    case 'exam-confirm-submit': closeModal(); submitExam(false); break;
    case 'exam-flag': toggleFlag(); break;
    case 'exam-prev': examMove(-1); break;
    case 'exam-next': examMove(1); break;
    case 'exam-retry': startExam(); break;
    case 'tut-tab': S.tutTab = d.tab; save(); renderTutorial(); window.scrollTo(0,0); break;
    case 'tut-open': S.tutOpen = d.tut; save(); renderTutorial(); window.scrollTo(0,0); break;
    case 'tut-read': toggleTutRead(); break;
    case 'tut-prev': tutMove(-1); break;
    case 'tut-next': tutMove(1); break;
    case 'video-open': openVideo(d.video); break;
    case 'col-cat': S.colCat = d.cat; save(); renderColumn(); window.scrollTo(0,0); break;
    case 'col-open': openArticle(d.col); break;
    case 'col-close': S.colOpen = null; save(); renderColumn(); window.scrollTo(0,0); break;
    case 'region': setRegion(d.region); break;
    case 'check-update': openUpdate(); break;
    case 'reset-confirm': confirmReset(); break;
    case 'reset-data': closeModal(); hardReset(false); break;
    case 'load-demo': confirmDemo(); break;
    case 'demo-confirm': closeModal(); hardReset(true); break;
    case 'clear-wrong':
      S.wrong = [];
      if(P && P.mode === 'wrong') P = null;
      save(); renderBank(); syncChrome(); toast('错题本已清空'); break;
    case 'close-modal': closeModal(); break;
  }
});

$('#scrim').addEventListener('click', e=>{
  if(e.target === $('#scrim')) closeModal();
});

document.addEventListener('keydown', e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;

  if(!$('#scrim').hidden){
    if(e.key === 'Escape'){ closeModal(); return; }
    if(e.key === 'Tab'){
      const f = $$('#scrim button:not([disabled]), #scrim a[href], #scrim input:not([disabled]), #scrim [tabindex]:not([tabindex="-1"])');
      if(f.length){
        const first = f[0], last = f[f.length-1], box = $('#scrim .modal');
        if(e.shiftKey && (document.activeElement === first || document.activeElement === box)){
          e.preventDefault(); last.focus();
        } else if(!e.shiftKey && document.activeElement === last){
          e.preventDefault(); first.focus();
        }
      }
    }
    return;
  }

  const k = e.key.toLowerCase();
  const digit = /^[1-6]$/.test(k) ? Number(k) - 1 : -1;
  const letter = /^[a-f]$/.test(k) ? k.charCodeAt(0) - 97 : -1;

  if(S.view === 'practice' && P && !P.done){
    if(k === 'f'){ e.preventDefault(); toggleFav(); }
    else if(digit > -1 || letter > -1){ e.preventDefault(); pickPractice(digit > -1 ? digit : letter); }
    else if(e.key === 'Enter'){
      e.preventDefault();
      if(P.checked) practiceNext();
      else if(P.picked.length) checkPractice();
    }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); practiceNext(); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); practicePrev(); }
  } else if(S.view === 'exam' && S.exam && S.exam.state === 'running'){
    if(digit > -1 || letter > -1){ e.preventDefault(); examPick(digit > -1 ? digit : letter); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); examMove(1); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); examMove(-1); }
  }
});
